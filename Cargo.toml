[workspace]
resolver = "2"
members = [
    # 1. 契约层 (Contracts)
    "contracts/rust/cy-manifest",
    "contracts/rust/cy-plugin-protocol",
    "contracts/rust/cy-proto",

    # 2. 内核层 (Kernel Crates)
    "kernel/crates/cy-local-transport",
    "kernel/crates/cy-node-agent",
    "kernel/crates/cy-plugin-supervisor",
    "kernel/crates/cy-kernel-api",
    "kernel/crates/cy-hardware-discovery",
    "kernel/crates/cy-resource-manager",
    "kernel/crates/cy-sandbox",
    "kernel/crates/cy-kernel-daemon",

    # 3. 框架层 (Framework Crates)
    "framework/crates/cy-extension-registry",
    "framework/crates/cy-platform-api",
]

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
