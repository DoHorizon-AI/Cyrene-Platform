[package]
name = "cy-plugin-protocol"
version = "0.1.0"
edition = "2021"

[dependencies]
prost = "0.12"
tokio = { version = "1.0", features = ["full"] }
bytes = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
prost-build = "0.12"
protoc-bin-vendored = "3"
