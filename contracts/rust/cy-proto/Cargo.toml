[package]
name = "cy-proto"
version = "0.1.0"
edition = "2021"
description = "Generated CYRENE Core v1 protocol types and tonic bindings."
license = "Apache-2.0"
repository = "https://github.com/DoHorizon-AI/Cyrene-Platform"

[lib]
name = "cy_proto"
path = "src/lib.rs"

[dependencies]
prost = "0.12"
prost-types = "0.12"
tonic = "0.11"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.11"
