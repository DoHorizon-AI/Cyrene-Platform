syntax = "proto3";

package cyrene.hardware.v1;

import "cyrene/core/v1/resource.proto";
import "cyrene/semantic/v1/kernel_contract.proto";
import "google/protobuf/timestamp.proto";

// The adapter protocol is local and request/response based.  The Kernel uses
// it over a Unix domain socket instead of exposing a vendor C ABI itself.
message AdapterRequest {
  uint32 protocol_version = 1;

  oneof body {
    GetInventoryRequest get_inventory = 2;
    CreateBindingRequest create_binding = 3;
  }
}

message GetInventoryRequest {
  string node_id = 1;
  uint64 known_generation = 2;
}

message CreateBindingRequest {
  // Deprecated compatibility field. New clients use resource.
  string device_id = 1 [deprecated = true];
  uint64 expected_inventory_generation = 2;
  cyrene.semantic.v1.Identity resource = 3;
}

message AdapterResponse {
  uint32 protocol_version = 1;
  string adapter_id = 2;

  oneof body {
    HardwareInventory inventory = 3;
    DeviceBinding binding = 4;
    AdapterError error = 5;
  }
}

message HardwareInventory {
  uint64 generation = 1;
  repeated cyrene.core.v1.AcceleratorDevice devices = 2 [deprecated = true];
  repeated AdapterFact facts = 3;
  repeated cyrene.core.v1.EnforcementReport enforcement = 4;
  google.protobuf.Timestamp sampled_at = 5;
  google.protobuf.Timestamp expires_at = 6;
  repeated cyrene.semantic.v1.Resource resources = 7;
}

message AdapterFact {
  string name = 1;
  bool available = 2;
  bool required = 3;
  string detail = 4;
}

message DeviceNode {
  string path = 1;
  optional uint32 major = 2;
  optional uint32 minor = 3;
  bool required = 4;
}

message DeviceBinding {
  string device_id = 1 [deprecated = true];
  repeated DeviceNode nodes = 2;
  map<string, string> environment = 3;
  repeated uint32 required_gids = 4;
  cyrene.core.v1.EnforcementMode enforcement = 5;
  string reason_code = 6;
  cyrene.semantic.v1.Identity resource = 7;
  // Adapter-owned merge policy. Kernel concatenates OrderedUniqueJoin keys
  // and still fail-closes exclusive conflicts. Vendor names stay in the adapter.
  map<string, EnvironmentMergeMode> environment_merge = 8;
}

enum EnvironmentMergeMode {
  ENVIRONMENT_MERGE_MODE_UNSPECIFIED = 0;
  ENVIRONMENT_MERGE_MODE_EXCLUSIVE = 1;
  ENVIRONMENT_MERGE_MODE_ORDERED_UNIQUE_JOIN = 2;
}

message AdapterError {
  string reason_code = 1;
  string message = 2;
  bool retryable = 3;
}
