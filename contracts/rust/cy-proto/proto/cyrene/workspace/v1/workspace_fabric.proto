// ┌─────────────────────────────────────────────────────────────────────┐
// │  📄 workspace_fabric.proto                                          │
// │  Package: cyrene.workspace.v1                                       │
// │  Role: Workspace discovery, connection, and API projection.         │
// │                                                                     │
// │  协议职责：Workspace 发现、连接描述符与中继 API 投影。                   │
// │  · Relay 只转发请求，不拥有 Workspace/Product 状态。                   │
// └─────────────────────────────────────────────────────────────────────┘
// SPDX-License-Identifier: Apache-2.0
syntax = "proto3";

package cyrene.workspace.v1;

import "cyrene/core/v1/node_control.proto";
import "cyrene/semantic/v1/kernel_contract.proto";
import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

// Relay roles authenticate independently from execution placement.
enum RelayParticipantRole {
  RELAY_PARTICIPANT_ROLE_UNSPECIFIED = 0;
  RELAY_PARTICIPANT_ROLE_FRONTEND = 1;
  RELAY_PARTICIPANT_ROLE_WORKSPACE_CONNECTOR = 2;
}

// A human identity reference issued by an external identity provider.
message UserIdentityRef {
  string issuer = 1;
  string subject = 2;
}

// Directory-owned enrollment metadata; this is not a Fabric Node identity.
message DeviceEnrollmentRef {
  string device_id = 1;
  string workspace_id = 2;
  string enrollment_state = 3;
}

// One transport-neutral candidate for reaching a Workspace API.
message WorkspaceConnectionCandidate {
  cyrene.core.v1.ConnectivityMode mode = 1;
  string provider_id = 2;
  string connection_uri = 3;
  string server_name = 4;
  uint32 priority = 5;
  // Opaque provider routing input. It is never a Workspace or Node identity.
  bytes routing_hint = 6;
}

// Directory response used by interactive, CLI, and automation clients.
message WorkspaceConnectionDescriptor {
  string descriptor_version = 1;
  string workspace_id = 2;
  string organization_id = 3;
  string display_name = 4;
  repeated WorkspaceConnectionCandidate candidates = 5;
  google.protobuf.Timestamp expires_at = 6;
}

// First authenticated frame on every relay connection.
message RelayHello {
  RelayParticipantRole role = 1;
  string session_credential = 2;
  UserIdentityRef user = 3;
  string organization_id = 4;
  // Empty for a frontend that has not discovered its Workspace yet.
  string workspace_id = 5;
  DeviceEnrollmentRef device = 6;
}

message RelayReady {
  string relay_session_id = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message DiscoverWorkspacesRequest {
  UserIdentityRef user = 1;
  string organization_id = 2;
}

message DiscoverWorkspacesResponse {
  repeated WorkspaceConnectionDescriptor workspaces = 1;
}

// Frontends request an existing canonical Artifact by URI, never by path.
message StartWorkspaceOperationRequest {
  cyrene.semantic.v1.Identity operation = 1;
  repeated string input_artifact_uris = 2;
}

message GetWorkspaceOperationRequest {
  cyrene.semantic.v1.Identity operation = 1;
}

// Canonical owners addressed by the closed Workspace Product API projection.
// These names select Product authorities; they do not define Product state.
// 这些标识只选择 Product 权威，不定义或保存其领域状态。
enum WorkspaceProductApiOwner {
  WORKSPACE_PRODUCT_API_OWNER_UNSPECIFIED = 0;
  WORKSPACE_PRODUCT_API_OWNER_CATALYST = 1;
  WORKSPACE_PRODUCT_API_OWNER_YIELD = 2;
  WORKSPACE_PRODUCT_API_OWNER_REACTOR = 3;
  WORKSPACE_PRODUCT_API_OWNER_EXCHANGE = 4;
  WORKSPACE_PRODUCT_API_OWNER_ECHO = 5;
  WORKSPACE_PRODUCT_API_OWNER_NAVIGATOR = 6;
}

// Stable wire keys for the operations admitted by the Phase 3 projection.
// The TCK maps each key to one owner contract operation and request kind.
// TCK 将每个 wire key 映射到 owner 契约操作及请求类型。
enum WorkspaceProductApiOperation {
  WORKSPACE_PRODUCT_API_OPERATION_UNSPECIFIED = 0;
  WORKSPACE_PRODUCT_API_OPERATION_01 = 1;
  WORKSPACE_PRODUCT_API_OPERATION_02 = 2;
  WORKSPACE_PRODUCT_API_OPERATION_03 = 3;
  WORKSPACE_PRODUCT_API_OPERATION_04 = 4;
  WORKSPACE_PRODUCT_API_OPERATION_05 = 5;
  WORKSPACE_PRODUCT_API_OPERATION_06 = 6;
  WORKSPACE_PRODUCT_API_OPERATION_07 = 7;
  WORKSPACE_PRODUCT_API_OPERATION_08 = 8;
  WORKSPACE_PRODUCT_API_OPERATION_09 = 9;
  WORKSPACE_PRODUCT_API_OPERATION_10 = 10;
  WORKSPACE_PRODUCT_API_OPERATION_11 = 11;
  WORKSPACE_PRODUCT_API_OPERATION_12 = 12;
  WORKSPACE_PRODUCT_API_OPERATION_13 = 13;
}

// The declared kind must match the allowlisted owner operation in the TCK.
// 声明的类型必须与 TCK allowlist 中的 owner 操作一致。
enum WorkspaceProductApiRequestKind {
  WORKSPACE_PRODUCT_API_REQUEST_KIND_UNSPECIFIED = 0;
  WORKSPACE_PRODUCT_API_REQUEST_KIND_READ = 1;
  WORKSPACE_PRODUCT_API_REQUEST_KIND_COMMAND = 2;
}

// A bounded Product call; it carries no URL, path, or caller-selected method.
message WorkspaceProductApiRequest {
  WorkspaceProductApiOwner owner = 1;
  WorkspaceProductApiOperation operation = 2;
  WorkspaceProductApiRequestKind kind = 3;
  // Opaque identifier issued by the owner; empty for collection or create calls.
  string resource_id = 4;
  // Valid application/json body, at most 4 MiB; forwarded without edits.
  // 合法的 application/json 请求体，最多 4 MiB；按原内容转发。
  bytes json_body = 5;
  // Replay key forwarded to the owner; its meaning and state remain there.
  // 重放键原样交给 owner，其语义与状态仍由 owner 管理。
  string idempotency_key = 6;
}

// Product responses may use JSON or RFC 9457 Problem Details JSON only.
// Product 响应仅可使用 JSON 或 RFC 9457 Problem Details JSON。
enum WorkspaceProductApiContentType {
  WORKSPACE_PRODUCT_API_CONTENT_TYPE_UNSPECIFIED = 0;
  WORKSPACE_PRODUCT_API_CONTENT_TYPE_APPLICATION_JSON = 1;
  WORKSPACE_PRODUCT_API_CONTENT_TYPE_APPLICATION_PROBLEM_JSON = 2;
}

// Product response bytes and status are returned without creating Platform state.
message WorkspaceProductApiResponse {
  uint32 status_code = 1;
  // Valid JSON body, at most 4 MiB; identity and replay data remain owner-owned.
  // 合法 JSON 响应体，最多 4 MiB；资源标识与重放语义仍归 owner 管理。
  bytes json_body = 2;
  WorkspaceProductApiContentType content_type = 3;
}

message WorkspaceApiRequest {
  string request_id = 1;
  string workspace_id = 2;
  // W3C trace context from the frontend; Relay forwards it unchanged.
  // 前端提供的 W3C 追踪上下文；Relay 按原样转发。
  string traceparent = 3;
  oneof request {
    StartWorkspaceOperationRequest start_operation = 10;
    GetWorkspaceOperationRequest get_operation = 11;
    WorkspaceProductApiRequest product_api = 12;
  }
}

// This is an API view of canonical Workspace/Operation state, not a state store.
enum WorkspaceOperationState {
  WORKSPACE_OPERATION_STATE_UNSPECIFIED = 0;
  WORKSPACE_OPERATION_STATE_PENDING = 1;
  WORKSPACE_OPERATION_STATE_SCHEDULED = 2;
  WORKSPACE_OPERATION_STATE_RUNNING = 3;
  WORKSPACE_OPERATION_STATE_SUCCEEDED = 4;
  WORKSPACE_OPERATION_STATE_FAILED = 5;
  WORKSPACE_OPERATION_STATE_LOST = 6;
}

message WorkspaceOperationView {
  cyrene.semantic.v1.Identity operation = 1;
  WorkspaceOperationState state = 2;
  uint64 completed_units = 3;
  uint64 total_units = 4;
  string unit = 5;
  repeated string artifact_uris = 6;
  repeated string resource_references = 7;
  string status_reason = 8;
  // Stable only for the authoritative Workspace process lifetime.
  string authority_instance_id = 9;
}

message WorkspaceApiResponse {
  string request_id = 1;
  oneof outcome {
    WorkspaceOperationView operation = 10;
    google.rpc.Status error = 11;
    WorkspaceProductApiResponse product_api = 12;
  }
}

// An authenticated request sent directly to a private Workspace endpoint.
message WorkspaceDirectRequest {
  RelayHello frontend = 1;
  WorkspaceApiRequest request = 2;
}

// The direct endpoint applies the same session and membership checks as Relay.
service WorkspaceDirectService {
  rpc Execute(WorkspaceDirectRequest) returns (WorkspaceApiResponse);
}

// Relay-only routing wrapper. The inner request remains Workspace API data.
message RelayForwardedRequest {
  string frontend_session_id = 1;
  WorkspaceApiRequest request = 2;
  oneof caller_principal {
    UserIdentityRef user = 3;
    DeviceEnrollmentRef device = 4;
    cyrene.core.v1.WorkloadIdentity workload = 5;
  }
  string caller_organization_id = 6;
  string caller_workspace_id = 7;
  repeated string caller_roles = 8;
}

message RelayForwardedResponse {
  string frontend_session_id = 1;
  WorkspaceApiResponse response = 2;
}

message RelayFrame {
  string frame_id = 1;
  oneof body {
    RelayHello hello = 10;
    RelayReady ready = 11;
    DiscoverWorkspacesRequest discover_request = 12;
    DiscoverWorkspacesResponse discover_response = 13;
    WorkspaceApiRequest workspace_request = 14;
    WorkspaceApiResponse workspace_response = 15;
    RelayForwardedRequest forwarded_request = 16;
    RelayForwardedResponse forwarded_response = 17;
    google.rpc.Status error = 18;
  }
}

// ════════════════════════════════════════════════════════════════════════
// SERVICE: WorkspaceRelayService
//
//   Routes authenticated frontend requests to an outbound Workspace
//   connection. It does not persist or reconcile Workspace state.
//   将认证后的前端请求路由到 Workspace 主动出站连接；不持久化 Workspace 状态。
// ════════════════════════════════════════════════════════════════════════
service WorkspaceRelayService {
  rpc Connect(stream RelayFrame) returns (stream RelayFrame);
}
