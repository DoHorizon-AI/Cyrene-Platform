// ┌─────────────────────────────────────────────────────────────────────┐
// │  📄 workspace_authority.proto                                       │
// │  Package: cyrene.workspace.authority.v2                             │
// │  Role: Owns authenticated workspace authorization and durable calls.│
// │                                                                     │
// │  协议职责：Platform Authority 独占身份、授权、唯一持久 outbox 与结果。 │
// │  · 客户端不提供角色、路由、目录版本；Connector 必须核验批准后执行。    │
// └─────────────────────────────────────────────────────────────────────┘
