// ┌─────────────────────────────────────────────────────────────────────┐
// │  📄 workspace_frontend_bridge.proto                                 │
// │  Package: cyrene.workspace.bridge.v1                                │
// │  Role: Local RPC bridge between Platform BFF and Connection Runtime.│
// │                                                                     │
// │  协议职责：Platform BFF 与独立连接运行时之间的本机解耦 RPC 契约。       │
// │  · BFF 仅通过 UDS/本地 RPC 调用本接口，不再静态链接连接实现。         │
// └─────────────────────────────────────────────────────────────────────┘
// SPDX-License-Identifier: Apache-2.0
syntax = "proto3";

package cyrene.workspace.bridge.v1;

option java_multiple_files = true;
option java_package = "io.cyrene.proto.workspace.bridge.v1";

import "cyrene/workspace/authority/v1/workspace_authority.proto";
import "cyrene/workspace/product/v2/product_api.proto";

message BridgeDiscoverWorkspacesRequest {
  string relay_endpoint = 1;
  string session_token = 2;
}

message BridgeDiscoverWorkspacesResponse {
  repeated cyrene.workspace.authority.v1.WorkspaceDescriptor workspaces = 1;
}

message BridgeExecuteInvocationRequest {
  cyrene.workspace.authority.v1.ApprovedInvocation approved_invocation = 1;
  string relay_endpoint = 2;
  string session_token = 3;
}

message BridgeExecuteInvocationResponse {
  bool success = 1;
  cyrene.workspace.product.v2.ProductApiResponseV2 product_response = 2;
  string error_message = 3;
}

service WorkspaceFrontendBridgeService {
  rpc DiscoverWorkspaces(BridgeDiscoverWorkspacesRequest) returns (BridgeDiscoverWorkspacesResponse);
  rpc ExecuteInvocation(BridgeExecuteInvocationRequest) returns (BridgeExecuteInvocationResponse);
}
