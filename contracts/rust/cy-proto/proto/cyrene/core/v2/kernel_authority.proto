syntax = "proto3";

package cyrene.core.v2;

import "cyrene/semantic/v1/kernel_contract.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "io.cyrene.proto.core.v2";

// Core v2 adds an explicit authority namespace while continuing to project the
// frozen semantic contract v1 nouns unchanged.
service KernelAuthorityService {
  rpc Negotiate(NegotiateRequest) returns (cyrene.semantic.v1.ContractRevision);

  rpc AcquireLease(AcquireLeaseRequest)
      returns (cyrene.semantic.v1.Lease);
  rpc RenewLease(RenewLeaseRequest) returns (cyrene.semantic.v1.Lease);
  rpc ReleaseLease(ReleaseLeaseRequest)
      returns (cyrene.semantic.v1.Lease);

  rpc StartWorker(StartWorkerRequest) returns (cyrene.semantic.v1.Operation);
  rpc ReportHeartbeat(ReportHeartbeatRequest) returns (cyrene.semantic.v1.Worker);
  rpc StopWorker(StopWorkerRequest) returns (cyrene.semantic.v1.Operation);

  rpc CreateOperation(CreateOperationRequest)
      returns (cyrene.semantic.v1.Operation);
  rpc ReportOperation(ReportOperationRequest)
      returns (cyrene.semantic.v1.Operation);
  rpc CancelOperation(CancelOperationRequest)
      returns (cyrene.semantic.v1.Operation);

  rpc PublishEndpoint(PublishEndpointRequest) returns (cyrene.semantic.v1.Endpoint);
  rpc AuthorizeEndpoint(AuthorizeEndpointRequest)
      returns (cyrene.semantic.v1.EndpointGrant);
  rpc RevokeEndpoint(RevokeEndpointRequest) returns (google.protobuf.Empty);
  rpc ReadEvents(ReadEventsRequest) returns (ReadEventsResponse);
  rpc WatchEvents(WatchEventsRequest)
      returns (stream WatchEventsResponse);
}

// Namespace is mandatory for every stateful Core v2 authority request. It is
// deliberately transport metadata, not a semantic v1 field.
message AuthorityCallContext {
  string namespace = 1;
  cyrene.semantic.v1.ContractRevision contract = 2;
  string request_id = 3;
  string idempotency_key = 4;
}

message NegotiateRequest {
  repeated cyrene.semantic.v1.ContractRevision offered = 1;
}

message AcquireLeaseRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Identity holder = 2;
  cyrene.semantic.v1.ResourceQuery query = 3;
  google.protobuf.Duration ttl = 4;
}

message RenewLeaseRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Identity lease = 2;
  uint64 fence_token = 3;
  google.protobuf.Duration ttl = 4;
}

message ReleaseLeaseRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Identity lease = 2;
  uint64 fence_token = 3;
}

message StartWorkerRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Worker worker = 2;
}

message ReportHeartbeatRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Identity worker = 2;
  cyrene.semantic.v1.Identity lease = 3;
  uint64 fence_token = 4;
}

message StopWorkerRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Identity worker = 2;
  cyrene.semantic.v1.Identity lease = 3;
  uint64 fence_token = 4;
  google.protobuf.Duration grace_period = 5;
}

message CreateOperationRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Operation operation = 2;
}

message ReportOperationRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Operation operation = 2;
}

message CancelOperationRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Identity operation = 2;
}

message PublishEndpointRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Endpoint endpoint = 2;
}

message AuthorizeEndpointRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.EndpointGrant grant = 2;
}

message RevokeEndpointRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Identity grant = 2;
}

message ReadEventsRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.EventCursor cursor = 2;
  uint32 limit = 3;
}

message ReadEventsResponse {
  cyrene.semantic.v1.EventPage page = 1;
}

message WatchEventsRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.EventCursor cursor = 2;
  uint32 page_size = 3;
}

// A Watch emits one Event at a time while continuity remains intact. If the
// cursor cannot continue incrementally, it emits a typed EventContinuity frame
// and closes the stream. EventPage remains exclusive to finite ReadEvents;
// transport/service failures remain gRPC status failures.
message WatchEventsResponse {
  reserved 2;
  reserved "continuity_change";

  oneof body {
    cyrene.semantic.v1.Event event = 1;
    cyrene.semantic.v1.EventContinuity continuity = 3;
  }
}
