[package]
name = "cy-manifest"
version = "0.1.0"
edition = "2021"
description = "Core CYRENE manifest types with deterministic canonical hashing (matches the Python SDK byte-for-byte)."
license = "Apache-2.0"

[lib]
name = "cy_manifest"
path = "src/lib.rs"

[[bin]]
name = "cy-manifest"
path = "src/bin/hash.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
serde_yaml = "0.9"
sha2 = "0.10"
