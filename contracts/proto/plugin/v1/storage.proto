syntax = "proto3";

package cy.plugin.v1;

message StoreArtifactRequest {
  string artifact_manifest_json = 1;
  bytes data = 2;
}

message StoreArtifactResponse {
  string artifact_id = 1;
}

message FetchArtifactRequest {
  string artifact_id = 1;
}

message FetchArtifactResponse {
  bytes data = 1;
}
