syntax = "proto3";

package cy.plugin.v1;

import "plugin/v1/probe.proto";
import "plugin/v1/model_analyzer.proto";
import "plugin/v1/compat_rule.proto";
import "plugin/v1/runtime_builder.proto";
import "plugin/v1/execution_engine.proto";
import "plugin/v1/training_backend.proto";
import "plugin/v1/quantization.proto";
import "plugin/v1/gateway_filter.proto";
import "plugin/v1/notification.proto";
import "plugin/v1/storage.proto";

message Envelope {
  string request_id = 1;
  string trace_id = 2;
  string plugin_id = 3;
  uint32 protocol_version = 4;
  int64 deadline_ms = 5;
  uint64 sequence_number = 6;
  uint64 generation = 7;
  uint64 fence_token = 8;

  oneof payload {
    // Control & Lifecycle
    Hello hello = 10;
    HelloAck hello_ack = 11;
    Configure configure = 12;
    Cancel cancel = 13;
    HealthCheck health_check = 14;
    HealthStatus health_status = 15;
    Shutdown shutdown = 16;
    CancelAck cancel_ack = 17;

    // Extension Points Payload RPC
    Invoke invoke = 20;
    InvokeResult invoke_result = 21;
    StreamItem stream_item = 22;

    // Capability application-event stream. This is deliberately separate from
    // the Kernel Event/SubscribeEvents control plane: the payload is owned by
    // the capability and is not a Kernel control-state record.
    Subscribe subscribe = 23;
    SubscribeAck subscribe_ack = 24;
    ApplicationEvent application_event = 25;
    ApplicationEventStreamEnd application_event_stream_end = 26;

    // Error
    PluginErrorPayload error = 30;
  }
}

message Hello {
  uint32 min_protocol_version = 1;
  uint32 max_protocol_version = 2;
  string host_version = 3;
}

message HelloAck {
  uint32 selected_protocol_version = 1;
  string plugin_id = 2;
  string plugin_version = 3;
  string api_version = 4;
  repeated string declared_capabilities = 5;
  map<string, string> metrics = 6;
  string capabilities_json = 7;
}

message Configure {
  map<string, string> settings = 1;
}

message Cancel {
  string target_request_id = 1;
  string reason = 2;
}

// Receipt only: it proves the executor accepted the cancellation request. The
// host must wait for the authoritative Operation terminal report separately.
message CancelAck {
  string target_request_id = 1;
}

message HealthCheck {}

message HealthStatus {
  enum Status {
    HEALTHY = 0;
    DEGRADED = 1;
    UNHEALTHY = 2;
  }
  Status status = 1;
  string message = 2;
}

message Shutdown {
  uint32 grace_period_ms = 1;
}

message PluginErrorPayload {
  enum Code {
    UNKNOWN = 0;
    UNAVAILABLE = 1;
    INCOMPATIBLE = 2;
    INVALID_INPUT = 3;
    PERMISSION_DENIED = 4;
    TIMEOUT = 5;
    CANCELLED = 6;
    RETRYABLE = 7;
    EXECUTION_FAILED = 8;
    PROTOCOL_ERROR = 9;
    FATAL = 10;
  }
  Code code = 1;
  string message = 2;
  string details = 3;
}

message Invoke {
  string extension_point = 1;
  string method = 2;

  // Opaque capability request bytes for generic worker-control consumers.
  // Typed extension requests remain available below for existing adapters.
  bytes payload = 3;

  oneof request {
    DetectHardwareRequest detect_hardware = 10;
    AnalyzeModelRequest analyze_model = 11;
    EvaluateCompatRequest evaluate_compat = 12;
    BuildRuntimeRequest build_runtime = 13;
    ExecuteInferenceRequest execute_inference = 14;
    RunTrainingStepRequest run_training_step = 15;
    QuantizeModelRequest quantize_model = 16;
    FilterRequest filter_request_data = 17;
    SendNotificationRequest send_notification = 18;
    StoreArtifactRequest store_artifact = 19;
    FetchArtifactRequest fetch_artifact = 20;
  }
}

message InvokeResult {
  // Opaque capability result bytes for generic worker-control consumers.
  bytes payload = 3;

  oneof response {
    DetectHardwareResponse detect_hardware = 10;
    AnalyzeModelResponse analyze_model = 11;
    EvaluateCompatResponse evaluate_compat = 12;
    BuildRuntimeResponse build_runtime = 13;
    ExecuteInferenceResponse execute_inference = 14;
    RunTrainingStepResponse run_training_step = 15;
    QuantizeModelResponse quantize_model = 16;
    FilterResponse filter_response_data = 17;
    SendNotificationResponse send_notification = 18;
    StoreArtifactResponse store_artifact = 19;
    FetchArtifactResponse fetch_artifact = 20;
  }
}

message StreamItem {
  string request_id = 1;
  uint64 sequence_number = 2;
  bool is_last = 3;

  oneof data {
    string text_chunk = 10;
    bytes binary_chunk = 11;
    string log_line = 12;
  }
}

// Starts one live application-event subscription for a capability. The
// subscription identity is the enclosing Envelope.request_id and is echoed by
// SubscribeAck and every subsequent event/end message.
message Subscribe {
  string capability = 1;

  // Opaque capability-defined subscription/filter bytes. The Platform does
  // not interpret this payload.
  bytes filter_payload = 2;

  // Maximum number of events the worker may buffer for this subscription.
  // Zero requests the worker default. Implementations must reject values above
  // their documented bound; this is never an unbounded queue.
  uint32 max_buffered_events = 3;
}

message SubscribeAck {
  string subscription_id = 1;
  string capability = 2;
}

// One capability-owned application event. Envelope.generation and
// Envelope.plugin_id provide the generation/source identity. event_sequence is
// strictly increasing from one within this subscription and worker generation.
// The v1 stream is live-only: it does not imply durable replay or exactly-once
// delivery.
message ApplicationEvent {
  string subscription_id = 1;
  string capability = 2;
  uint64 event_sequence = 3;
  string event_type = 4;
  bytes payload = 5;
}

// Terminal condition for one application-event stream. A worker crash may
// prevent this frame from being sent; in that case the caller synthesizes the
// WORKER_CRASH reason from the observed transport disconnect.
message ApplicationEventStreamEnd {
  enum Reason {
    NORMAL_COMPLETION = 0;
    CANCELLED = 1;
    WORKER_UNAVAILABLE = 2;
    WORKER_CRASH = 3;
    PROTOCOL_FAILURE = 4;
    GENERATION_TERMINATED = 5;
    BACKPRESSURE = 6;
  }

  string subscription_id = 1;
  string capability = 2;
  Reason reason = 3;
  string message = 4;
}
