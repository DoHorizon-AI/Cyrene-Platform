//! │  📄 workspace_relay.proto                                          │
//! │  Package: cyrene.workspace.relay.v1                                │
//! │  Role: High-performance bidirectional streaming Relay protocol.    │
//! └─────────────────────────────────────────────────────────────────────┘
// SPDX-License-Identifier: Apache-2.0
syntax = "proto3";

package cyrene.workspace.relay.v1;

option java_multiple_files = true;
option java_package = "io.cyrene.proto.workspace.relay.v1";

import "cyrene/workspace/bridge/v1/workspace_frontend_bridge.proto";

message RelayPing {
  uint64 timestamp_ms = 1;
}

message RelayPong {
  uint64 timestamp_ms = 1;
}

message RelayFrame {
  string frame_id = 1;
  string session_id = 2;
  string workspace_id = 3;
  oneof payload {
    RelayPing ping = 10;
    RelayPong pong = 11;
    cyrene.workspace.bridge.v1.BridgeExecuteInvocationRequest invocation_request = 12;
    cyrene.workspace.bridge.v1.BridgeExecuteInvocationResponse invocation_response = 13;
  }
}

service WorkspaceRelayService {
  rpc RelayStream(stream RelayFrame) returns (stream RelayFrame);
  rpc HealthCheck(RelayPing) returns (RelayPong);
}
