syntax = "proto3";

package cyrene.core.v2;

import "cyrene/semantic/v1/kernel_contract.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";

option java_multiple_files = true;
option java_package = "io.cyrene.proto.core.v2";

// Core v2 adds an explicit authority namespace while continuing to project the
// frozen semantic contract v1 nouns unchanged.
service KernelAuthorityService {
  rpc Negotiate(NegotiateRequest) returns (cyrene.semantic.v1.ContractRevision);

  rpc AcquireLease(AcquireLeaseRequest)
      returns (cyrene.semantic.v1.Lease);
  rpc RenewLease(RenewLeaseRequest) returns (cyrene.semantic.v1.Lease);
  rpc ReleaseLease(ReleaseLeaseRequest)
      returns (cyrene.semantic.v1.Lease);

  rpc StartWorker(StartWorkerRequest) returns (cyrene.semantic.v1.Operation);
  rpc ReportHeartbeat(ReportHeartbeatRequest) returns (cyrene.semantic.v1.Worker);
  rpc StopWorker(StopWorkerRequest) returns (cyrene.semantic.v1.Operation);

  rpc CreateOperation(CreateOperationRequest)
      returns (cyrene.semantic.v1.Operation);
  rpc ReportOperation(ReportOperationRequest)
      returns (cyrene.semantic.v1.Operation);
  rpc CancelOperation(CancelOperationRequest)
      returns (cyrene.semantic.v1.Operation);

  rpc PublishEndpoint(PublishEndpointRequest) returns (cyrene.semantic.v1.Endpoint);
  rpc AuthorizeEndpoint(AuthorizeEndpointRequest)
      returns (cyrene.semantic.v1.EndpointGrant);
  rpc RevokeEndpoint(RevokeEndpointRequest) returns (google.protobuf.Empty);
  rpc ReadEvents(ReadEventsRequest) returns (ReadEventsResponse);
  rpc WatchEvents(WatchEventsRequest)
      returns (stream WatchEventsResponse);

  rpc GetUpdateReadiness(UpdateReadinessRequest)
      returns (UpdateReadinessResponse);
  rpc BeginMaintenance(BeginMaintenanceRequest)
      returns (BeginMaintenanceResponse);
  // Starts the one-time CORE_RUNTIME hold that activates a never-active
  // source from an exact successful CoreBootstrap. Ordinary readiness is unchanged.
  // 仅为首次激活从未活动来源建立 CORE_RUNTIME 门禁，不改变普通就绪判断。
  rpc BeginInitialSourceActivation(BeginInitialSourceActivationRequest)
      returns (BeginMaintenanceResponse);
  rpc EndMaintenance(EndMaintenanceRequest)
      returns (EndMaintenanceResponse);
  rpc AdmitTask(AdmitTaskRequest) returns (AdmitTaskResponse);
  rpc UpdateTaskActivity(UpdateTaskActivityRequest)
      returns (UpdateTaskActivityResponse);
  rpc CompleteTask(CompleteTaskRequest) returns (CompleteTaskResponse);
  rpc HeartbeatActivitySource(HeartbeatActivitySourceRequest)
      returns (HeartbeatActivitySourceResponse);
  rpc ReconcileActivitySource(ReconcileActivitySourceRequest)
      returns (ReconcileActivitySourceResponse);
  rpc ListActiveTasks(ListActiveTasksRequest)
      returns (ListActiveTasksResponse);
}

// Namespace is mandatory for every stateful Core v2 authority request. It is
// deliberately transport metadata, not a semantic v1 field.
message AuthorityCallContext {
  string namespace = 1;
  cyrene.semantic.v1.ContractRevision contract = 2;
  string request_id = 3;
  string idempotency_key = 4;
}

message NegotiateRequest {
  repeated cyrene.semantic.v1.ContractRevision offered = 1;
}

message AcquireLeaseRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Identity holder = 2;
  cyrene.semantic.v1.ResourceQuery query = 3;
  google.protobuf.Duration ttl = 4;
}

message RenewLeaseRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Identity lease = 2;
  uint64 fence_token = 3;
  google.protobuf.Duration ttl = 4;
}

message ReleaseLeaseRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Identity lease = 2;
  uint64 fence_token = 3;
}

message StartWorkerRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Worker worker = 2;
}

message ReportHeartbeatRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Identity worker = 2;
  cyrene.semantic.v1.Identity lease = 3;
  uint64 fence_token = 4;
}

message StopWorkerRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Identity worker = 2;
  cyrene.semantic.v1.Identity lease = 3;
  uint64 fence_token = 4;
  google.protobuf.Duration grace_period = 5;
}

message CreateOperationRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Operation operation = 2;
}

message ReportOperationRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Operation operation = 2;
}

message CancelOperationRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Identity operation = 2;
}

message PublishEndpointRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Endpoint endpoint = 2;
}

message AuthorizeEndpointRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.EndpointGrant grant = 2;
}

message RevokeEndpointRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.Identity grant = 2;
}

message ReadEventsRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.EventCursor cursor = 2;
  uint32 limit = 3;
}

message ReadEventsResponse {
  cyrene.semantic.v1.EventPage page = 1;
}

message WatchEventsRequest {
  AuthorityCallContext context = 1;
  cyrene.semantic.v1.EventCursor cursor = 2;
  uint32 page_size = 3;
}

// A Watch emits one Event at a time while continuity remains intact. If the
// cursor cannot continue incrementally, it emits a typed EventContinuity frame
// and closes the stream. EventPage remains exclusive to finite ReadEvents;
// transport/service failures remain gRPC status failures.
message WatchEventsResponse {
  reserved 2;
  reserved "continuity_change";

  oneof body {
    cyrene.semantic.v1.Event event = 1;
    cyrene.semantic.v1.EventContinuity continuity = 3;
  }
}

// Update readiness and maintenance gate messages.
// 更新就绪状态与维护门控消息。
enum MaintenanceTargetKind {
  MAINTENANCE_TARGET_KIND_UNSPECIFIED = 0;
  MAINTENANCE_TARGET_KIND_PACKAGE_ONLY = 1;
  MAINTENANCE_TARGET_KIND_CORE_RUNTIME = 2;
}

enum UpdateReadinessStatus {
  UPDATE_READINESS_STATUS_UNSPECIFIED = 0;
  UPDATE_READINESS_STATUS_READY = 1;
  UPDATE_READINESS_STATUS_ACTIVE_TASKS = 2;
  UPDATE_READINESS_STATUS_IDLE_RUNTIME_REQUIRES_UNLOAD = 3;
  UPDATE_READINESS_STATUS_MAINTENANCE_ACTIVE = 4;
  UPDATE_READINESS_STATUS_STALE_READINESS = 5;
  UPDATE_READINESS_STATUS_USER_CONFIRMATION_REQUIRED = 6;
}

enum MaintenanceOutcome {
  MAINTENANCE_OUTCOME_UNSPECIFIED = 0;
  MAINTENANCE_OUTCOME_SUCCESS = 1;
  MAINTENANCE_OUTCOME_ROLLED_BACK = 2;
  MAINTENANCE_OUTCOME_FAILED = 3;
}

enum WorkspaceTaskActivityState {
  WORKSPACE_TASK_ACTIVITY_STATE_UNSPECIFIED = 0;
  WORKSPACE_TASK_ACTIVITY_STATE_ACCEPTED = 1;
  WORKSPACE_TASK_ACTIVITY_STATE_QUEUED = 2;
  WORKSPACE_TASK_ACTIVITY_STATE_DISPATCHING = 3;
  WORKSPACE_TASK_ACTIVITY_STATE_RUNNING = 4;
  WORKSPACE_TASK_ACTIVITY_STATE_CANCELING = 5;
  WORKSPACE_TASK_ACTIVITY_STATE_INFLIGHT = 6;
}

message ActiveWorkspaceTask {
  string source_id = 1;
  string task_id = 2;
  WorkspaceTaskActivityState state = 3;
}

message UpdateReadinessRequest {
  MaintenanceTargetKind target_kind = 1;
  repeated string expected_activity_sources = 2;
  uint64 expected_catalog_generation = 3;
  bool requires_restart = 4;
}

message UpdateReadinessResponse {
  UpdateReadinessStatus status = 1;
  uint64 gate_generation = 2;
  uint64 active_task_count = 3;
  uint64 active_worker_count = 4;
  uint64 active_lease_or_allocation_count = 5;
  repeated string unknown_activity_sources = 6;
  repeated string blocker_codes = 7;
  repeated ActiveWorkspaceTask active_tasks = 8;
  uint64 install_catalog_generation = 9;
  uint64 inflight_runtime_admission_count = 10;
  bool requires_restart_confirmation = 11;
}

message BeginMaintenanceRequest {
  string request_id = 1;
  MaintenanceTargetKind target_kind = 2;
  uint64 expected_gate_generation = 3;
  bool user_confirmed_restart = 4;
  repeated string expected_activity_sources = 5;
  uint64 expected_catalog_generation = 6;
  string operator_token = 7;
  string plan_id = 8;
  string plan_digest = 9;
  map<string, string> component_artifact_digests = 10;
}

// Exact continuation identity for first activation of a trusted activity source.
// 首次激活受信活动来源时使用，父事务与目标组件摘要都必须精确匹配。
message BeginInitialSourceActivationRequest {
  string request_id = 1;
  string parent_request_id = 2;
  string source_id = 3;
  uint64 expected_gate_generation = 4;
  bool user_confirmed_restart = 5;
  repeated string expected_activity_sources = 6;
  uint64 expected_catalog_generation = 7;
  string operator_token = 8;
  string plan_id = 9;
  string plan_digest = 10;
  map<string, string> component_artifact_digests = 11;
}

message BeginMaintenanceResponse {
  UpdateReadinessStatus status = 1;
  string maintenance_token = 2;
  uint64 gate_generation = 3;
  repeated string blocker_codes = 4;
}

message EndMaintenanceRequest {
  string request_id = 1;
  string maintenance_token = 2;
  MaintenanceOutcome outcome = 3;
  bool healthy = 4;
  string operator_token = 5;
}

message EndMaintenanceResponse {
  bool unlocked = 1;
  UpdateReadinessStatus status = 2;
  uint64 gate_generation = 3;
  repeated string blocker_codes = 4;
}

message AdmitTaskRequest {
  string source_id = 1;
  string task_id = 2;
  WorkspaceTaskActivityState state = 3;
  string idempotency_key = 4;
  string source_token = 5;
}

message AdmitTaskResponse {
  reserved 3;
  reserved "activity_token";

  bool admitted = 1;
  UpdateReadinessStatus status = 2;
  uint64 gate_generation = 4;
  repeated string blocker_codes = 5;
}

message UpdateTaskActivityRequest {
  reserved 5;
  reserved "activity_token";

  string source_id = 1;
  string task_id = 2;
  WorkspaceTaskActivityState state = 3;
  string idempotency_key = 4;
  string source_token = 6;
}

message UpdateTaskActivityResponse {
  bool accepted = 1;
  UpdateReadinessStatus status = 2;
  uint64 gate_generation = 3;
  repeated string blocker_codes = 4;
}

message CompleteTaskRequest {
  reserved 1;
  reserved "activity_token";

  string source_id = 2;
  string task_id = 3;
  string source_token = 4;
}

message CompleteTaskResponse {
  bool completed = 1;
  uint64 gate_generation = 2;
  repeated string blocker_codes = 3;
}

message HeartbeatActivitySourceRequest {
  string source_id = 1;
  string source_token = 2;
  uint64 expected_catalog_generation = 3;
}

message HeartbeatActivitySourceResponse {
  uint64 last_heartbeat_unix_ms = 1;
  uint64 gate_generation = 2;
}

message TaskActivity {
  string task_id = 1;
  WorkspaceTaskActivityState state = 2;
}

message ReconcileActivitySourceRequest {
  string source_id = 1;
  string source_token = 2;
  uint64 expected_catalog_generation = 3;
  repeated TaskActivity active_tasks = 4;
}

message ReconcileActivitySourceResponse {
  uint64 gate_generation = 1;
  bool reconciled = 2;
}

message ListActiveTasksRequest {
  string source_id = 1;
  string source_token = 2;
}

message ListActiveTasksResponse {
  repeated TaskActivity active_tasks = 1;
}
