syntax = "proto3";

package cyrene.capability.v1;

import "google/protobuf/any.proto";

option java_multiple_files = true;
option java_package = "io.cyrene.proto.capability.v1";
option java_outer_classname = "CapabilityExecutionProto";
option csharp_namespace = "Cyrene.Capability.V1";

// Product-facing capability execution boundary.
//
// This service exposes capability semantics only. Resolution, activation,
// worker lifecycle, protocol framing, and process details remain inside the
// Platform implementation. Capability application events are also distinct
// from cyrene.core.v1 Kernel control events and are not written to the Kernel
// event history by this service.
service CapabilityExecutionService {
  // Resolve, activate, invoke, and clean up one capability execution.
  // The caller's native gRPC deadline and cancellation are the execution
  // lifetime authority; there is no timeout field in this request.
  rpc InvokeCapability(InvokeCapabilityRequest)
      returns (InvokeCapabilityResponse);

  // Resolve, activate, invoke, and clean up one capability execution while
  // forwarding worker-produced typed chunks as they arrive. This additive
  // method keeps the unary InvokeCapability contract unchanged for operations
  // that do not expose a live result stream.
  rpc InvokeCapabilityStream(InvokeCapabilityRequest)
      returns (stream CapabilityInvocationStreamItem);

  // Start one live capability application-event stream. The server allocates
  // the opaque subscription identity returned in stream items; callers do not
  // choose or operate a worker subscription ID.
  rpc SubscribeCapabilityEvents(SubscribeCapabilityEventsRequest)
      returns (stream CapabilityEventStreamItem);
}

message InvokeCapabilityRequest {
  string capability = 1;
  string interface_version = 2;
  string method = 3;

  // Capability-owned typed protobuf payload. Products should use Any's
  // type_url/value contract; the Platform never interprets domain fields.
  google.protobuf.Any request = 4;

  // Optional stable identity of the configured capability instance to target.
  // Empty/omitted preserves legacy implicit resolution when it is unambiguous.
  optional string binding_id = 5;
}

message InvokeCapabilityResponse {
  oneof result {
    // Capability-owned typed protobuf result.
    google.protobuf.Any response = 1;
    // Generic execution failure. This is distinct from a gRPC transport
    // status and from a capability/domain result encoded in response.
    CapabilityExecutionError error = 2;
  }
}

// One live typed result stream for a capability invocation. The capability
// owns the response Any type; Platform only preserves ordering and terminal
// outcome. Worker-produced response items start at sequence one and the
// terminal item follows them. A pre-execution error/end item may use sequence
// zero. A stream has exactly one terminal outcome and never replays chunks.
message CapabilityInvocationStreamItem {
  uint64 sequence = 1;

  oneof item {
    google.protobuf.Any response = 2;
    CapabilityExecutionError error = 3;
    CapabilityInvocationStreamEnd stream_end = 4;
  }
}

message CapabilityInvocationStreamEnd {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    NORMAL_COMPLETION = 1;
    CANCELLED = 2;
    CAPABILITY_UNAVAILABLE = 3;
    WORKER_CRASH = 4;
    PROTOCOL_FAILURE = 5;
    TIMEOUT = 6;
  }

  Reason reason = 1;
  string message = 2;
}

message SubscribeCapabilityEventsRequest {
  string capability = 1;
  string interface_version = 2;

  // Optional capability-owned typed filter. The Platform does not inspect it.
  google.protobuf.Any filter = 3;

  // Optional stable identity of the configured capability instance to target.
  // Empty/omitted preserves legacy implicit resolution when it is unambiguous.
  optional string binding_id = 4;
}

// Event and terminal state are structurally distinct stream items.
message CapabilityEventStreamItem {
  oneof item {
    CapabilityApplicationEvent application_event = 1;
    CapabilityEventStreamEnd stream_end = 2;
  }
}

message CapabilityApplicationEvent {
  // Server-assigned opaque Product subscription identity. It is not a worker
  // request ID and is never caller-controlled.
  string subscription_id = 1;
  string capability = 2;
  uint64 event_sequence = 3;
  string event_type = 4;
  google.protobuf.Any payload = 5;

  // Abstract provider execution identity for diagnostics. These fields never
  // contain a PID, process handle, stdio identity, or other worker detail.
  uint64 generation = 6;
  string source_id = 7;

  // Stable configured capability identity selected for this stream. It is
  // independent from the provider source and runtime generation.
  string binding_id = 8;
}

message CapabilityEventStreamEnd {
  string subscription_id = 1;
  string capability = 2;
  uint64 generation = 3;
  string source_id = 4;
  CapabilityEventStreamEndReason reason = 5;
  string message = 6;
  CapabilityExecutionError error = 7;

  // Stable configured capability identity selected for this stream. It is
  // independent from the provider source and runtime generation.
  string binding_id = 8;
}

enum CapabilityEventStreamEndReason {
  CAPABILITY_EVENT_STREAM_END_REASON_UNSPECIFIED = 0;
  CAPABILITY_EVENT_STREAM_END_REASON_NORMAL_COMPLETION = 1;
  CAPABILITY_EVENT_STREAM_END_REASON_CANCELLED = 2;
  CAPABILITY_EVENT_STREAM_END_REASON_CAPABILITY_UNAVAILABLE = 3;
  CAPABILITY_EVENT_STREAM_END_REASON_WORKER_CRASH = 4;
  CAPABILITY_EVENT_STREAM_END_REASON_PROTOCOL_FAILURE = 5;
  CAPABILITY_EVENT_STREAM_END_REASON_GENERATION_TERMINATED = 6;
  CAPABILITY_EVENT_STREAM_END_REASON_BACKPRESSURE = 7;
}

message CapabilityExecutionError {
  enum Code {
    CODE_UNSPECIFIED = 0;
    CODE_CAPABILITY_UNAVAILABLE = 1;
    CODE_ACTIVATION_FAILED = 2;
    CODE_PROTOCOL_MISMATCH = 3;
    CODE_INVALID_REQUEST = 4;
    CODE_EXECUTION_FAILURE = 5;
    CODE_WORKER_CRASHED = 6;
    CODE_TIMEOUT = 7;
    CODE_CANCELLED = 8;
    CODE_BACKPRESSURE = 9;
    CODE_STREAM_TERMINATED = 10;
    CODE_GENERATION_TERMINATED = 11;
  }

  Code code = 1;
  string message = 2;
}
