[package]
name = "cyrene-sandboxd"
version = "0.1.0"
edition = "2021"
description = "Privileged Linux cgroup v2 Sandbox Adapter Host for CYRENE"
license = "AGPL-3.0-only"

[lib]
name = "cyrene_sandboxd"
path = "src/lib.rs"

[dependencies]
cy-kernel-api = { path = "../../../kernel/crates/cy-kernel-api" }
cy-proto = { path = "../../../contracts/rust/cy-proto" }
libc = "0.2"
nix = { version = "0.29", features = ["socket", "user", "process"] }
prost = "0.13"
cy-observability = { path = "../../../framework/crates/cy-observability" }
tracing = "0.1"

[dev-dependencies]
cy-sandbox-client = { path = "../../../kernel/crates/cy-sandbox-client" }
tempfile = "3"
