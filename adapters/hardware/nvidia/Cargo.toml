[package]
name = "cyrene-nvidia-adapter"
version = "0.1.0"
edition = "2021"
description = "Out-of-process NVIDIA hardware adapter for the CYRENE Kernel"
license = "Apache-2.0"

[dependencies]
cy-kernel-contract = { version = "0.1.0", path = "../../../contracts/rust/cy-kernel-contract" }
cy-proto = { path = "../../../contracts/rust/cy-proto" }
prost = "0.13"
prost-types = "0.13"
nix = { version = "0.29", features = ["socket", "user", "process"] }

[dev-dependencies]
tempfile = "3.8"
