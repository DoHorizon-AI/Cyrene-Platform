[package]
name = "cy-package-runtime"
version = "0.1.0"
edition = "2024"
description = "Production package lifecycle and worker activation seam for CYRENE"
license = "Apache-2.0"

[[bin]]
name = "cy-package-runtime"
path = "src/main.rs"

[dependencies]
cy-manifest = { path = "../../../contracts/rust/cy-manifest" }
cy-platform-api = { path = "../cy-platform-api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
