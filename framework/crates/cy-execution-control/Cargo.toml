[package]
name = "cy-execution-control"
version = "0.1.0"
edition = "2021"
description = "Product-neutral placement-to-assignment control for CYRENE execution agents."
license = "AGPL-3.0-only"

[dependencies]
cy-execution-fabric = { path = "../cy-execution-fabric" }
cy-kernel-api = { path = "../../../kernel/crates/cy-kernel-api" }
cy-kernel-contract = { path = "../../../contracts/rust/cy-kernel-contract" }
cy-proto = { path = "../../../contracts/rust/cy-proto" }
prost = "0.12"
prost-types = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = { version = "0.11", features = ["transport", "tls"] }
uuid = { version = "1", features = ["v4"] }
cy-observability = { path = "../cy-observability" }
tracing = "0.1"

[dev-dependencies]
chrono = "0.4"
cy-kernel-daemon = { path = "../../../kernel/crates/cy-kernel-daemon" }
cy-manifest = { path = "../../../contracts/rust/cy-manifest" }
cy-node-agent = { path = "../../../agents/node/cy-node-agent" }
cy-resource-manager = { path = "../../../kernel/crates/cy-resource-manager" }
cy-runtime-agent = { path = "../../../agents/runtime/cy-runtime-agent" }
cyrene-linux-sys-adapter = { path = "../../../adapters/hardware/linux_sys" }
tempfile = "3.8"
