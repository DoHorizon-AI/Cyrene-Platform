[package]
name = "cy-installation-resolver"
version = "0.1.0"
edition = "2021"
description = "Verified local installation-record adapter for CYRENE Kernel launches"
license = "Apache-2.0"

[lib]
name = "cy_installation_resolver"
path = "src/lib.rs"

[dependencies]
cy-kernel-api = { path = "../../../kernel/crates/cy-kernel-api" }
cy-manifest = { path = "../../../contracts/rust/cy-manifest" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3.8"
