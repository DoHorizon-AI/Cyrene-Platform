[package]
name = "cy-workspace-fabric"
version = "0.1.0"
edition = "2021"
description = "Workspace discovery, authenticated transport, and loopback client proxy."
license = "Apache-2.0"
repository = "https://github.com/DoHorizon-AI/Cyrene-Platform"

[dependencies]
cy-proto = { version = "0.1.0", path = "../../../contracts/rust/cy-proto" }
cy-workspace-client-sdk = { version = "0.1.0", path = "../cy-workspace-client-sdk" }
cy-workspace-control-plane = { version = "0.1.0", path = "../cy-workspace-control-plane" }
cy-workspace-relay-runtime = { version = "0.1.0", path = "../cy-workspace-relay-runtime" }
cy-observability = { version = "0.1.0", path = "../cy-observability" }
getrandom = "0.2"
prost-types = "0.13"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
tonic = { version = "0.12", features = ["transport", "tls"] }

[dev-dependencies]
tempfile = "3.8"
tower = { version = "0.5", features = ["util"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }

[[bin]]
name = "cy-workspace-fabric-fixture"
path = "src/bin/cy-workspace-fabric-fixture.rs"
