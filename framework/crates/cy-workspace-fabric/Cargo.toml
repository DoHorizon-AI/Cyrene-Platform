[package]
name = "cy-workspace-fabric"
version = "0.1.0"
edition = "2021"
description = "Workspace discovery, authenticated transport, and loopback client proxy."
license = "Apache-2.0"
repository = "https://github.com/DoHorizon-AI/Cyrene-Platform"

[dependencies]
base64 = "0.22"
cy-proto = { version = "0.1.0", path = "../../../contracts/rust/cy-proto" }
ed25519-dalek = "2.2"
hmac = "0.12"
futures-util = "0.3"
jsonwebtoken = { version = "11.1", default-features = false, features = ["rust_crypto", "use_pem"] }
openssl = { version = "0.10", features = ["vendored"] }
prost-types = "0.13"
prost = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.32.1", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = { version = "0.12", features = ["transport", "tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
webpki = { package = "rustls-webpki", version = "0.103", features = ["ring"] }
url = "2.5"
webauthn-rs = { version = "0.5.5", features = ["danger-allow-state-serialisation", "danger-credential-internals"] }
cy-observability = { version = "0.1.0", path = "../cy-observability" }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }
getrandom = "0.2"
x509-parser = "0.18.1"
zeroize = "1.8"
sqlx = {
    version = "0.8.6",
    default-features = false,
    features = ["runtime-tokio-rustls", "postgres", "uuid", "migrate", "macros"],
}

[dev-dependencies]
base64 = "0.22"
tempfile = "3.8"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
webauthn-authenticator-rs = { version = "0.5.5", features = ["softpasskey"] }

[[bin]]
name = "cy-workspace-fabric-fixture"
path = "src/bin/cy-workspace-fabric-fixture.rs"

[[bin]]
name = "cy-workspace-relay-host"
path = "src/bin/cy-workspace-relay-host.rs"

[[bin]]
name = "cy-workspace-sidecar"
path = "src/bin/cy-workspace-sidecar.rs"

[[bin]]
name = "cy-workspace-directory-admin"
path = "src/bin/cy-workspace-directory-admin.rs"
