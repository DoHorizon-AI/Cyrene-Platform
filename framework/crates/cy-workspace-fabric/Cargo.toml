[package]
name = "cy-workspace-fabric"
version = "0.1.0"
edition = "2021"
description = "Transport-neutral Workspace discovery and relay connectivity."
license = "Apache-2.0"
repository = "https://github.com/DoHorizon-AI/Cyrene-Platform"

[dependencies]
cy-proto = { version = "0.1.0", path = "../../../contracts/rust/cy-proto" }
prost-types = "0.13"
prost = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.12", features = ["transport", "tls"] }
cy-observability = { version = "0.1.0", path = "../cy-observability" }
tracing = "0.1"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "cy-workspace-fabric-fixture"
path = "src/bin/cy-workspace-fabric-fixture.rs"
