[package]
name = "cy-capability-execution-service"
version = "0.1.0"
edition = "2024"
description = "Language-neutral CYRENE capability execution service"
license = "Apache-2.0"

[lib]
name = "cy_capability_execution_service"
path = "src/lib.rs"

[[bin]]
name = "cyrene-capability-execution-service"
path = "src/main.rs"

[dependencies]
cy-manifest = { version = "0.1.0", path = "../../../contracts/rust/cy-manifest" }
cy-platform-api = { version = "0.1.0", path = "../cy-platform-api" }
cy-proto = { version = "0.1.0", path = "../../../contracts/rust/cy-proto" }
futures-core = "0.3"
prost-types = "0.14"
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.11"
uuid = { version = "1.0", features = ["v4"] }
