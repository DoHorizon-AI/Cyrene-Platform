[package]
name = "cy-workspace-client-sdk"
version = "0.1.0"
edition = "2021"
description = "Lightweight client SDK for authenticated Workspace discovery and relay calls."
license = "Apache-2.0"
repository = "https://github.com/DoHorizon-AI/Cyrene-Platform"

[dependencies]
cy-mtls-channel-client = { version = "0.1.0", path = "../cy-mtls-channel-client" }
cy-proto = { version = "0.1.0", path = "../../../contracts/rust/cy-proto", default-features = false }
prost-types = "0.13"
thiserror = "1.0"
tokio = { version = "1.35", features = ["sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.12", default-features = false, features = ["channel", "tls", "codegen", "prost"] }
tracing = "0.1"
