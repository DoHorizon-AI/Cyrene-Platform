[package]
name = "cy-platform-api"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.91"
bytes = "1.0"
cy-manifest = { version = "0.1.0", path = "../../../contracts/rust/cy-manifest" }
cy-plugin-protocol = { path = "../../../contracts/rust/cy-plugin-protocol" }
prost = "0.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
