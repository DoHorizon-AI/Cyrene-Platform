[package]
name = "cy-workspace-sidecar"
version = "0.1.0"
edition = "2021"
description = "Loopback-only Workspace API bridge for non-Rust clients."
license = "Apache-2.0"
repository = "https://github.com/DoHorizon-AI/Cyrene-Platform"

[dependencies]
cy-proto = { version = "0.1.0", path = "../../../contracts/rust/cy-proto" }
cy-workspace-client-sdk = { version = "0.1.0", path = "../cy-workspace-client-sdk" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.35", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tonic = { version = "0.12", features = ["transport", "tls"] }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.8"
tokio-stream = { version = "0.1", features = ["net"] }
