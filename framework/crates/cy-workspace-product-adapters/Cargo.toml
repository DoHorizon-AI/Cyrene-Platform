[package]
name = "cy-workspace-product-adapters"
version = "0.1.0"
edition = "2021"
description = "Catalog-driven generic Product HTTP adapter for Workspace Connector composition."
license = "Apache-2.0"
repository = "https://github.com/DoHorizon-AI/Cyrene-Platform"

[dependencies]
async-trait = "0.1"
cy-workspace-product-contracts = { version = "0.1.0", path = "../cy-workspace-product-contracts" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.8"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "net", "time"] }
