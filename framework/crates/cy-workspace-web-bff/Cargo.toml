[package]
name = "cy-workspace-web-bff"
version = "0.1.0"
edition = "2021"
description = "Composable same-origin HTTP BFF for authenticated Workspace Product projections."
license = "Apache-2.0"
repository = "https://github.com/DoHorizon-AI/Cyrene-Platform"
build = "build.rs"

[dependencies]
async-trait = "0.1"
axum = "0.7"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
cy-proto = { version = "0.1.0", path = "../../../contracts/rust/cy-proto" }
cy-workspace-fabric = { version = "0.1.0", path = "../cy-workspace-fabric" }
hmac = "0.12"
http = "1"
jsonschema = { version = "0.18", default-features = false, features = ["draft201909", "draft202012"] }
mime = "0.3"
prost-types = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
sha2 = "0.10"
