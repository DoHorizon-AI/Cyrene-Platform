[plugin]
id = "com.cy.notification.jvm"
name = "jvm_notification_poc"
version = "1.0.0"
api_version = "1.0"
kind = "notification"
edition = "community"
runtime = "subprocess-jvm"
license_gate = false
author = "CY Team"
description = "Minimal JVM Notification Plugin POC over zero-port stdio framing"
entrypoint = "com.cy.plugin.jvm.PocNotificationPlugin"

[capabilities]
supported_hardware = ["cpu"]
supported_precisions = ["fp32"]
supported_quantizations = ["none"]
supports_streaming = false
features = ["jvm_runner", "notification"]

[dependencies]
system_dependencies = ["java"]
