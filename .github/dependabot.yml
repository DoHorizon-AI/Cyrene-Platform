version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: "pip"
    directory: "/sdk/python/cyrene_preflight"
    schedule:
      interval: "weekly"
    groups:
      python-dependencies:
        patterns: ["*"]
