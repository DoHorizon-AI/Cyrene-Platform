name: Workspace Relay image build only

on:
  push:
    branches: [develop, main, release]
  pull_request:
    branches: [develop, main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-relay-image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-build:
    name: Build the Relay image without publishing
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build-only Relay image with provenance and SBOM
        uses: docker/build-push-action@v6
        with:
          context: .
          file: framework/crates/cy-workspace-relay-host/Dockerfile
          platforms: linux/amd64
          push: false
          tags: ghcr.io/dohorizon-ai/cyrene-workspace-relay:build-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true
