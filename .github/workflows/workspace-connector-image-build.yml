name: Workspace Connector image build only

on:
  push:
    branches: [develop, main, release]
  pull_request:
    branches: [develop, main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-connector-image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-build:
    name: Build the Connector image without publishing
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare GHCR reference metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/dohorizon-ai/cyrene-workspace-connector
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=long

      - name: Build image only
        uses: docker/build-push-action@v6
        with:
          context: .
          file: framework/crates/cy-workspace-fabric/Dockerfile.connector
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record build-only disposition
        env:
          IMAGE_NAME: ghcr.io/dohorizon-ai/cyrene-workspace-connector
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Built image name: `%s`\n\n' "$IMAGE_NAME"
            printf 'This workflow does not authenticate to GHCR, publish an image, create Azure resources, or move traffic.\n'
          } >> "$GITHUB_STEP_SUMMARY"
