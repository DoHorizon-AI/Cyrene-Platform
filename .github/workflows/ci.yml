name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: ci / docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation links and indexes
        run: python tooling/docs/validate_docs.py

  governance:
    name: ci / governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Run architecture boundary guard
        run: |
          uv sync --frozen
          uv run --frozen python tooling/ci/check_service_boundaries.py
          uv run --frozen python -m pytest tooling/ci/test_check_service_boundaries.py

  python-sdk:
    name: ci / python-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install Python SDKs and dependencies
        run: |
          uv sync --frozen
      - name: Run SDK unit tests
        run: |
          uv run --frozen python -m pytest sdk/python/cyrene_artifacts/tests
          uv run --frozen python -m pytest sdk/python/cyrene_environment/tests
          uv run --frozen python -m pytest sdk/python/cyrene_preflight/tests
          uv run --frozen python -m pytest sdk/python/cyrene_control_plane/tests
          uv run --frozen python -m pytest tooling/workspace/tests
          uv run --frozen python -m pytest tooling/docs/tests
          uv run --frozen python -m pytest tooling/ci/tests

  rust-kernel:
    name: ci / rust-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Check Cargo workspace (--locked)
        run: cargo check --locked --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run Rust unit tests (--locked)
        run: cargo test --locked --workspace
