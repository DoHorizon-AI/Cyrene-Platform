name: ci

on:
  push:
    branches: [develop, main, release, fix/*, chore/*, feat/*]
  pull_request:
    branches: [develop, main, release]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: ci / docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate documentation links and indexes
        run: python tooling/docs/validate_docs.py

  governance:
    name: ci / governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install repository guard tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Run architecture boundary guard
        run: |
          python -m pip install pytest hypothesis "pyyaml>=6.0"
          python tooling/ci/check_service_boundaries.py
          python -m pytest tooling/ci/test_check_service_boundaries.py
          python tooling/governance/validate_repository_policy.py
          python -m pytest tooling/governance/tests/test_repository_policy.py
          bash tooling/ci/check-no-legacy-surface.sh

  licensing-boundary:
    name: ci / licensing-boundary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify public/core dependency firewall
        run: python tooling/ci/check-license-boundary.py
      - name: Verify license metadata
        run: python tooling/ci/check-license-metadata.py
      - name: Verify package-local protocol sources
        run: bash tooling/ci/check-public-proto-sync.sh
      - name: Package public Rust interfaces
        run: bash tooling/ci/check-public-packages.sh
      - name: Compile independent external consumers
        run: bash tooling/acceptance/licensing-boundary/run.sh

  python-sdk:
    name: ci / python-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install repository guard tools
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install Python SDKs and dependencies
        run: |
          python -m pip install --upgrade pip pytest hypothesis "pyyaml>=6.0"
          python -m pip install -e sdk/python/cyrene_artifacts
          python -m pip install -e sdk/python/cyrene_preflight
      - name: Run SDK unit tests
        run: |
          python -m pytest sdk/python/cyrene_artifacts/tests
          python -m pytest sdk/python/cyrene_preflight/tests
          python -m pytest tooling/docs/tests
          python -m pytest tooling/ci/tests

  platform-core:
    name: ci / platform-core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Check Cargo workspace (--locked)
        run: cargo check --locked --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run Rust unit tests (--locked)
        run: cargo test --locked --workspace

  publish-artifact:
    name: ci / immutable-artifact
    if: github.event_name != 'pull_request'
    needs: [docs, governance, licensing-boundary, python-sdk, platform-core]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install release packaging tools
        run: python -m pip install --disable-pip-version-check build PyYAML
      - name: Build immutable release bundle
        env:
          ARTIFACT_NAME: cyrene-platform-${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git archive --format=tar.gz --prefix="Cyrene-Platform-${GITHUB_SHA}/" "${GITHUB_SHA}" \
            > "dist/cyrene-platform-${GITHUB_SHA}.source.tar.gz"
          python tooling/release/build_python_sdks.py --repo-path . --output-dir release-dist
          mv release-dist/* dist/
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("dist")
          payload = []
          for path in sorted(dist.iterdir()):
              if path.name == "artifact-manifest.json":
                  continue
              payload.append(
                  {
                      "file": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "kind": "release-payload",
                  }
              )
          if not payload:
              raise SystemExit("artifact payload is empty")
          manifest = {
              "schema_version": 1,
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commit_sha": os.environ["GITHUB_SHA"],
              "workflow_run_id": int(os.environ["GITHUB_RUN_ID"]),
              "artifact_name": os.environ["ARTIFACT_NAME"],
              "payload": payload,
          }
          (dist / "artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cyrene-platform-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 30
