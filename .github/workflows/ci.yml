name: ci

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: ci / docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate documentation links and indexes
        run: python tooling/docs/validate_docs.py

  governance:
    name: ci / governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run architecture boundary guard
        run: |
          python -m pip install pytest hypothesis
          python tooling/ci/check_service_boundaries.py
          python -m pytest tooling/ci/test_check_service_boundaries.py

  python-sdk:
    name: ci / python-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python SDKs and dependencies
        run: |
          python -m pip install --upgrade pip pytest hypothesis "pyyaml>=6.0"
          python -m pip install -e sdk/python/cyrene_artifacts
          python -m pip install -e sdk/python/cyrene_environment
          python -m pip install -e sdk/python/cyrene_preflight
          python -m pip install -e sdk/python/cyrene_control_plane
      - name: Run SDK unit tests
        run: |
          python -m pytest sdk/python/cyrene_artifacts/tests
          python -m pytest sdk/python/cyrene_environment/tests
          python -m pytest sdk/python/cyrene_preflight/tests
          python -m pytest sdk/python/cyrene_control_plane/tests
          python -m pytest tooling/workspace/tests
          python -m pytest tooling/docs/tests
          python -m pytest tooling/ci/tests

  rust-kernel:
    name: ci / rust-kernel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout exact Plugins runtime for cross-repository TCK
        uses: actions/checkout@v4
        with:
          repository: DoHorizon-AI/Cyrene-Plugins-Official
          ref: 7906f2672a1b80620a32840bd95c81a9cc38352c
          path: .ci/plugins
          token: ${{ secrets.CYRENE_CROSS_REPO_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Check Cargo workspace (--locked)
        run: cargo check --locked --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run Rust unit tests (--locked)
        env:
          CYRENE_PLUGINS_WORKTREE: ${{ github.workspace }}/.ci/plugins
        run: cargo test --locked --workspace
