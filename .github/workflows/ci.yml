name: ci

on:
  push:
    branches: [develop, main, fix/*, chore/*, feat/*]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: ci / docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Validate documentation links and indexes
        run: python tooling/docs/validate_docs.py

  governance:
    name: ci / governance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run architecture boundary guard
        run: |
          python -m pip install pytest hypothesis "pyyaml>=6.0"
          python tooling/ci/check_service_boundaries.py
          python -m pytest tooling/ci/test_check_service_boundaries.py
          python tooling/governance/validate_repository_policy.py
          python -m pytest tooling/governance/tests/test_repository_policy.py
          bash tooling/ci/check-no-legacy-surface.sh

  jvm-contracts:
    name: ci / jvm-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic
      - name: Test generated JVM contract consumer
        run: gradle --no-daemon -p tck/model-provider-embedding-contract/jvm test

  dotnet-contracts:
    name: ci / dotnet-contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Build and run generated .NET contract consumers
        run: |
          dotnet build tck/capability-execution-service/dotnet/CapabilityExecutionServiceTck.csproj --configuration Release
          dotnet run --project tck/message-connector-contract/dotnet/MessageConnectorContractTck.csproj --configuration Release
          dotnet run --project tck/model-provider-embedding-contract/dotnet/ModelProviderEmbeddingContractTck.csproj --configuration Release

  python-sdk:
    name: ci / python-sdk
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python SDKs and dependencies
        run: |
          python -m pip install --upgrade pip pytest hypothesis "pyyaml>=6.0"
          python -m pip install -e sdk/python/cyrene_artifacts
          python -m pip install -e sdk/python/cyrene_preflight
          python -m pip install -e "sdk/python/cyrene_capability_client[dev]"
      - name: Run SDK unit tests
        run: |
          python sdk/python/cyrene_capability_client/scripts/generate_proto.py --check
          python -m pytest sdk/python/cyrene_capability_client/tests
          python -m pytest sdk/python/cyrene_worker_shim/test_stream_item_wire.py
          python -m pytest sdk/python/cyrene_artifacts/tests
          python -m pytest sdk/python/cyrene_preflight/tests
          python -m pytest tooling/docs/tests
          python -m pytest tooling/ci/tests

  platform-core:
    name: ci / platform-core
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Check Cargo workspace (--locked)
        run: cargo check --locked --workspace --all-targets
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run Rust unit tests (--locked)
        run: cargo test --locked --workspace
