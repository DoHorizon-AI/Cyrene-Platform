name: Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the advanced-service example
        run: >-
          python framework/tooling/validate_advanced_service.py
          --schema contracts/schemas/advanced-service.schema.json
          examples/advanced-service/service.json
      - name: Compile Python SDK sources
        run: >-
          python -m compileall
          framework/sdk/python/cy-manifest/src
          framework/sdk/python/cy-plugin-sdk/src

  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --locked
