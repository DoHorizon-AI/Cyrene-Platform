name: Immutable component release

on:
  push:
    branches: [main, release, develop]
  pull_request:
    branches: [main, release, develop]

permissions:
  contents: read

concurrency:
  group: component-release-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  component-release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      packages: write
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      SOURCE_REF: ${{ github.ref }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ github.ref == 'refs/heads/develop' && 'preview' || 'stable' }}
      RELEASE_ID: ${{ (github.ref == 'refs/heads/develop' && 'preview-' || 'stable-') }}${{ github.sha }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      CATALOG_COMMIT: 522524b86a8f79c70e948fed8cb27c4cc70f29c4
      CATALOG_SHA256: 248a9a3b27f3d1daa4c0a6fdc405c612fd492483bb4157ff46b6d2836ffd0d35
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out the trusted component catalog
        uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Workspace
          ref: ${{ env.CATALOG_COMMIT }}
          path: workspace-catalog
          persist-credentials: false

      - name: Verify source, channel, and catalog pins
        run: |
          set -euo pipefail
          OUTPUT_ROOT="$RUNNER_TEMP/component-release"
          echo "OUTPUT_ROOT=$OUTPUT_ROOT" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          case "$CHANNEL:$SOURCE_REF" in
            stable:refs/heads/main|stable:refs/heads/release|preview:refs/heads/develop) ;;
            *) echo "release channel does not match the exact source ref" >&2; exit 2 ;;
          esac
          test "$RELEASE_ID" = "$CHANNEL-$SOURCE_COMMIT"
          actual_catalog_sha="$(sha256sum workspace-catalog/governance/component-catalog-v1.json | cut -d ' ' -f 1)"
          test "$actual_catalog_sha" = "$CATALOG_SHA256"
          mkdir -p "$OUTPUT_ROOT"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          target: x86_64-unknown-linux-gnu

      - name: Set up Python release tools
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tooling dependencies
        run: python -m pip install --disable-pip-version-check build pyyaml pytest -r tooling/release/requirements.txt

      - name: Prove immutable release is enabled and unused
        run: |
          set -euo pipefail
          python tooling/release/preflight_component_release.py \
            --repository "$SOURCE_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --channel "$CHANNEL" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT" \
            --repository-root .

      - name: Run release test gates
        run: cargo test --locked --workspace --all-targets

      - name: Build V2 Product contracts from the tracked owner SHAs
        id: product-contracts
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check \
            -r tooling/workspace-product-contract-bundle/requirements.txt
          output="$RUNNER_TEMP/workspace-product-contracts"
          checkout_root="$RUNNER_TEMP/pinned-product-sources"
          python tooling/release/prepare_workspace_product_contracts.py \
            --repository . \
            --output "$output" \
            --checkout-root "$checkout_root"
          test -f "$output/product-contract-bundle.json"
          test -f "$output/workspace-product-policy-v2.json"
          echo "root=$output" >> "$GITHUB_OUTPUT"

      - name: Build and attest native binaries
        run: |
          set -euo pipefail
          python tooling/release/build_native_components.py \
            --repository . \
            --output "$OUTPUT_ROOT/native" \
            --channel "$CHANNEL" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --catalog workspace-catalog/governance/component-catalog-v1.json \
            --catalog-sha256 "$CATALOG_SHA256" \
            --product-contracts-root "${{ steps.product-contracts.outputs.root }}"

      - name: Build and attest the Runtime Maintenance SDK bundle
        id: runtime-sdk
        run: |
          set -euo pipefail
          python tooling/release/build_runtime_sdk_bundle.py \
            --repository . \
            --output "$OUTPUT_ROOT/runtime-sdk"
          sdk_archive="$OUTPUT_ROOT/runtime-sdk/cyrene-runtime-maintenance-sdk-linux-ubuntu-24.04-x86_64-python-3.12-library.tar.gz"
          python tooling/release/component_descriptor.py \
            --component-id cyrene-runtime-maintenance-sdk \
            --version 0.1.0 \
            --channel "$CHANNEL" \
            --repository "$SOURCE_REPOSITORY" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --catalog workspace-catalog/governance/component-catalog-v1.json \
            --catalog-sha256 "$CATALOG_SHA256" \
            --target-json '{"os":"linux","osVersion":"24.04","distribution":"ubuntu","distributionVersion":"24.04","architecture":"x86_64","abi":"glibc-2.39","runtime":"python:3.12"}' \
            --artifact-kind python-bundle \
            --format tar.gz \
            --subject-name "$(basename "$sdk_archive")" \
            --output "$OUTPUT_ROOT/runtime-sdk/descriptor.json"
          mkdir -p "$OUTPUT_ROOT/native/artifacts" "$OUTPUT_ROOT/native/manifests"
          cp "$sdk_archive" "$OUTPUT_ROOT/native/artifacts/"
          python tooling/release/create_component_manifest.py \
            --descriptor "$OUTPUT_ROOT/runtime-sdk/descriptor.json" \
            --artifact "$sdk_archive" \
            --payload-root "$OUTPUT_ROOT/runtime-sdk/payload" \
            --output-dir "$OUTPUT_ROOT/native/manifests" > "$OUTPUT_ROOT/runtime-sdk/manifest-result.json"
          sdk_manifest_digest="$(python - "$OUTPUT_ROOT/runtime-sdk/manifest-result.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["manifestDigest"])
          PY
          )"
          echo "manifest_digest=$sdk_manifest_digest" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify unique OCI publication tags
        run: |
          set -euo pipefail
          for image in \
            ghcr.io/dohorizon-ai/cyrene-workspace-relay \
            ghcr.io/dohorizon-ai/cyrene-workspace-connector \
            ghcr.io/dohorizon-ai/cyrene-workspace-web-bff \
            ghcr.io/dohorizon-ai/cyrene-runtime-maintenance; do
            if docker buildx imagetools inspect "$image:$RELEASE_ID-$IMAGE_TAG" >/dev/null 2>&1; then
              echo "image tag already exists: $image:$RELEASE_ID-$IMAGE_TAG" >&2
              exit 2
            fi
          done

      - name: Build and push immutable Relay OCI image
        id: relay-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: framework/crates/cy-workspace-relay-host/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dohorizon-ai/cyrene-workspace-relay:${{ env.RELEASE_ID }}-${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_ID }}
          provenance: mode=max
          sbom: true

      - name: Attest Relay OCI image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/dohorizon-ai/cyrene-workspace-relay
          subject-digest: ${{ steps.relay-image.outputs.digest }}
          push-to-registry: true
          github-token: ${{ github.token }}

      - name: Build and push immutable Connector OCI image
        id: connector-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: framework/crates/cy-workspace-connector-host/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dohorizon-ai/cyrene-workspace-connector:${{ env.RELEASE_ID }}-${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_ID }}
          provenance: mode=max
          sbom: true

      - name: Attest Connector OCI image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/dohorizon-ai/cyrene-workspace-connector
          subject-digest: ${{ steps.connector-image.outputs.digest }}
          push-to-registry: true
          github-token: ${{ github.token }}

      - name: Build and push immutable Web BFF OCI image
        id: bff-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: framework/crates/cy-workspace-web-bff/Dockerfile
          build-contexts: |
            product-contracts=${{ steps.product-contracts.outputs.root }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dohorizon-ai/cyrene-workspace-web-bff:${{ env.RELEASE_ID }}-${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_ID }}
          provenance: mode=max
          sbom: true

      - name: Attest Web BFF OCI image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/dohorizon-ai/cyrene-workspace-web-bff
          subject-digest: ${{ steps.bff-image.outputs.digest }}
          push-to-registry: true
          github-token: ${{ github.token }}

      - name: Read Runtime Maintenance component version
        id: runtime-version
        run: |
          set -euo pipefail
          version="$(python - "$OUTPUT_ROOT/native/manifests" <<'PY'
          import json, sys
          from pathlib import Path
          rows = [json.loads(path.read_text(encoding="utf-8")) for path in Path(sys.argv[1]).glob("*.manifest.json")]
          matches = [row for row in rows if row.get("componentId") == "cyrene-runtime-maintenance" and row.get("artifact", {}).get("kind") == "native-binary"]
          if len(matches) != 1:
              raise SystemExit("expected one native Runtime Maintenance manifest")
          print(matches[0]["version"])
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push Runtime Maintenance Linux OCI broker image
        id: runtime-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tooling/release/Dockerfile.runtime-maintenance
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dohorizon-ai/cyrene-runtime-maintenance:${{ env.RELEASE_ID }}-${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_ID }}
            io.cyrene.component.version=${{ steps.runtime-version.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Attest Runtime Maintenance OCI image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/dohorizon-ai/cyrene-runtime-maintenance
          subject-digest: ${{ steps.runtime-image.outputs.digest }}
          push-to-registry: true
          github-token: ${{ github.token }}

      - name: Generate checksum subjects for native and SDK bundles
        run: |
          set -euo pipefail
          (cd "$OUTPUT_ROOT/native/artifacts" && sha256sum ./*.tar.gz | sed 's#  \./#  #') \
            > "$RUNNER_TEMP/component-payload-checksums.txt"

      - name: Attest native and SDK bundle payloads
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ runner.temp }}/component-payload-checksums.txt
          github-token: ${{ github.token }}

      - name: Create attestable OCI manifests
        env:
          RELAY_DIGEST: ${{ steps.relay-image.outputs.digest }}
          CONNECTOR_DIGEST: ${{ steps.connector-image.outputs.digest }}
          BFF_DIGEST: ${{ steps.bff-image.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.runtime-image.outputs.digest }}
        run: |
          set -euo pipefail
          lock="tooling/workspace-product-contract-bundle/releases/workspace-product-v2.lock.json"
          compatibility="$(python - "$lock" "$SOURCE_COMMIT" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          lock_path = Path(sys.argv[1])
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          print(json.dumps({
              "groupId": "workspace-product-v2",
              "contractApiVersion": lock["contractApiVersion"],
              "wireApiVersion": lock["wireApiVersion"],
              "contractLock": {
                  "repository": "DoHorizon-AI/Cyrene-Platform",
                  "commit": sys.argv[2],
                  "path": lock_path.as_posix(),
                  "sha256": "sha256:" + hashlib.sha256(lock_path.read_bytes()).hexdigest(),
              },
          }, sort_keys=True))
          PY
          )"
          make_oci_manifest() {
            component_id="$1" image_repository="$2" digest="$3" target="$4" needs_group="$5"
            version="$(python - "$OUTPUT_ROOT/native/manifests" "$component_id" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          component = sys.argv[2]
          matches = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in root.glob("*.manifest.json")
              if json.loads(path.read_text(encoding="utf-8")).get("componentId") == component
              and json.loads(path.read_text(encoding="utf-8")).get("artifact", {}).get("kind") == "native-binary"
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one native release manifest for {component}, got {len(matches)}")
          print(matches[0]["version"])
          PY
          )"
            args=(
              --component-id "$component_id" --version "$version"
              --channel "$CHANNEL" --repository "$SOURCE_REPOSITORY"
              --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT"
              --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
              --catalog workspace-catalog/governance/component-catalog-v1.json
              --catalog-sha256 "$CATALOG_SHA256"
              --target-json "$target"
              --artifact-kind oci-image --subject-name "$image_repository"
              --oci-repository "$image_repository" --oci-digest "$digest"
              --oci-platform-json '{"os":"linux","architecture":"amd64"}'
              --output "$OUTPUT_ROOT/descriptor-$component_id.json"
            )
            if [ "$needs_group" = true ]; then args+=(--compatibility-json "$compatibility"); fi
            python tooling/release/component_descriptor.py "${args[@]}"
            python tooling/release/create_component_manifest.py \
              --descriptor "$OUTPUT_ROOT/descriptor-$component_id.json" \
              --output-dir "$OUTPUT_ROOT/native/manifests"
          }
          linux_docker_target='{"os":"linux","osVersion":"24.04","distribution":"ubuntu","distributionVersion":"24.04","architecture":"x86_64","abi":"glibc-2.39","runtime":"docker:linux"}'
          windows_docker_target='{"os":"windows","osVersion":"10.0","architecture":"x86_64","runtime":"docker-desktop:linux"}'
          make_oci_manifest cy-workspace-relay ghcr.io/dohorizon-ai/cyrene-workspace-relay "$RELAY_DIGEST" "$linux_docker_target" true
          make_oci_manifest cy-workspace-connector ghcr.io/dohorizon-ai/cyrene-workspace-connector "$CONNECTOR_DIGEST" "$linux_docker_target" true
          make_oci_manifest cy-workspace-web-bff ghcr.io/dohorizon-ai/cyrene-workspace-web-bff "$BFF_DIGEST" "$linux_docker_target" true
          make_oci_manifest cyrene-runtime-maintenance ghcr.io/dohorizon-ai/cyrene-runtime-maintenance "$RUNTIME_DIGEST" "$windows_docker_target" false

      - name: Create and attest the immutable component index
        run: |
          set -euo pipefail
          python tooling/release/component_artifacts.py index \
            --manifest-dir "$OUTPUT_ROOT/native/manifests" \
            --channel "$CHANNEL" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --workflow "$SOURCE_REPOSITORY/.github/workflows/component-release.yml" \
            --output "$OUTPUT_ROOT/component-release-index-v1.json"

      - name: Validate release documents against the pinned Workspace schemas
        run: |
          set -euo pipefail
          for manifest in "$OUTPUT_ROOT/native/manifests"/*.manifest.json; do
            python tooling/release/validate_component_schema.py \
              --kind manifest \
              --document "$manifest" \
              --schema-dir workspace-catalog/governance
          done
          python tooling/release/validate_component_schema.py \
            --kind index \
            --document "$OUTPUT_ROOT/component-release-index-v1.json" \
            --schema-dir workspace-catalog/governance

      - name: Generate the exact component index checksum subject
        run: |
          set -euo pipefail
          (cd "$OUTPUT_ROOT" && sha256sum component-release-index-v1.json) \
            > "$RUNNER_TEMP/component-index-checksum.txt"

      - name: Attest the exact component index bytes
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ runner.temp }}/component-index-checksum.txt
          github-token: ${{ github.token }}

      - name: Create the draft release with all durable assets
        id: release
        run: |
          set -euo pipefail
          release_args=(
            "$RELEASE_ID"
            "$OUTPUT_ROOT/native/artifacts"/*.tar.gz \
            "$OUTPUT_ROOT/native/manifests"/*.manifest.json \
            "$OUTPUT_ROOT/component-release-index-v1.json" \
            --draft \
            --target "$SOURCE_COMMIT" \
            --title "Cyrene component release $RELEASE_ID" \
            --notes "Immutable component release for source $SOURCE_COMMIT on $SOURCE_REF. Assets are addressed by manifest digests and verified GitHub artifact attestations."
          )
          if [ "$CHANNEL" = preview ]; then release_args+=(--prerelease); fi
          gh release create "${release_args[@]}"
          release_id="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$RELEASE_ID" --jq .id)"
          gh api --method PATCH "repos/$SOURCE_REPOSITORY/releases/$release_id" -F draft=false >/dev/null
          immutable="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$RELEASE_ID" --jq .immutable)"
          if [ "$immutable" != true ]; then
            echo "GitHub did not mark the published release immutable" >&2
            exit 2
          fi
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Reverify the published index and every release manifest
        run: |
          set -euo pipefail
          python tooling/release/component_artifacts.py verify-index \
            --index "$OUTPUT_ROOT/component-release-index-v1.json" \
            --catalog workspace-catalog/governance/component-catalog-v1.json \
            --verify-run \
            --verify-attestation
          for manifest in "$OUTPUT_ROOT/native/manifests"/*.manifest.json; do
            artifact_name="$(python - "$manifest" <<'PY'
          import json, sys
          from urllib.parse import urlparse
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          artifact = doc["artifact"]
          print(urlparse(artifact["uri"]).path.rsplit("/", 1)[-1] if artifact["kind"] != "oci-image" else "")
          PY
          )"
            verify_args=(--manifest "$manifest" --catalog workspace-catalog/governance/component-catalog-v1.json --verify-run --verify-attestation)
            if [ -n "$artifact_name" ]; then verify_args+=(--artifact "$OUTPUT_ROOT/native/artifacts/$artifact_name"); fi
            python tooling/release/component_artifacts.py verify "${verify_args[@]}"
          done

      - name: Summarize immutable release identity
        run: |
          set -euo pipefail
          python - "$OUTPUT_ROOT/component-release-index-v1.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          index = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"## {index['channel']} component release")
          print(f"\nSource: `{index['source']['repository']}@{index['source']['commit']}` ({index['source']['ref']})")
          print(f"\nIndex digest: `{index['indexDigest']}`\n")
          for release in index['releases']:
              print(f"- `{release['componentId']}` `{release['version']}` `{release['manifestDigest']}` — {release['manifestUri']}")
          PY

  pull-request-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check out the pinned component schemas
        uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Workspace
          ref: 522524b86a8f79c70e948fed8cb27c4cc70f29c4
          path: workspace-catalog
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          target: x86_64-unknown-linux-gnu
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check build pyyaml pytest -r tooling/release/requirements.txt
      - run: cargo test --locked --workspace --all-targets
      - name: Validate component tooling and RFC 8785 fixtures
        env:
          CYRENE_COMPONENT_CATALOG: workspace-catalog/governance/component-catalog-v1.json
          CYRENE_COMPONENT_CATALOG_SHA256: 248a9a3b27f3d1daa4c0a6fdc405c612fd492483bb4157ff46b6d2836ffd0d35
        run: |
          set -euo pipefail
          python -m pytest tooling/release/tests -q
          python tooling/release/validate_component_schema.py \
            --kind manifest \
            --document tooling/release/tests/fixtures/component-release-manifest-v1.json \
            --schema-dir workspace-catalog/governance
          python tooling/release/validate_component_schema.py \
            --kind index \
            --document tooling/release/tests/fixtures/component-release-index-v1.json \
            --schema-dir workspace-catalog/governance
