name: Immutable component release

on:
  push:
    branches: [main, release, develop]
  pull_request:
    branches: [main, release, develop]

permissions:
  contents: read

concurrency:
  group: component-release-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

env:
  CATALOG_HELPER_SOURCE_COMMIT: "87b8e676300eb2a9041740e651773cb01a2a7724"
  CATALOG_RELEASE_ID: ${{ github.ref == 'refs/heads/develop' && vars.CYRENE_PREVIEW_COMPONENT_CATALOG_RELEASE_ID || (github.ref != 'refs/heads/develop' && vars.CYRENE_STABLE_COMPONENT_CATALOG_RELEASE_ID) }}

jobs:
  catalog-input:
    if: github.event_name != 'pull_request'
    name: fetch and verify immutable Workspace component catalog
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      attestations: read
    outputs:
      catalog_sha256: ${{ steps.fetch.outputs.catalog_sha256 }}
      catalog_release_id: ${{ steps.fetch.outputs.catalog_release_id }}
    env:
      CHANNEL: ${{ github.ref == 'refs/heads/develop' && 'preview' || 'stable' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the fixed catalog verifier and schemas
        uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Workspace
          ref: ${{ env.CATALOG_HELPER_SOURCE_COMMIT }}
          path: catalog-helper
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            packaging/fetch_component_catalog.py
            packaging/catalog_metadata.py
            packaging/component_updates.py
            governance/component-catalog-v1.json
            governance/component-catalog-v1.schema.json
            governance/component-release-manifest-v1.schema.json
            governance/component-release-manifest-v2.schema.json
            governance/component-release-index-v1.schema.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned catalog verifier dependency
        run: python -m pip install --disable-pip-version-check jsonschema==4.26.0
      - name: Fetch and verify an exact immutable catalog release
        id: fetch
        env:
          CATALOG_RELEASE_ID: ${{ env.CATALOG_RELEASE_ID }}
        run: |
          set -euo pipefail
          mkdir -p workspace-catalog/governance
          for schema in \
            component-catalog-v1.schema.json \
            component-release-manifest-v1.schema.json \
            component-release-manifest-v2.schema.json \
            component-release-index-v1.schema.json; do
            cp "catalog-helper/governance/$schema" workspace-catalog/governance/
          done
          args=(--output workspace-catalog/governance/component-catalog-v1.json \
            --metadata-output workspace-catalog/component-catalog-release.json \
            --schema-root catalog-helper/governance)
          if [[ -n "$CATALOG_RELEASE_ID" ]]; then
            args+=(--release-id "$CATALOG_RELEASE_ID")
          else
            args+=(--latest-channel "$CHANNEL")
          fi
          python catalog-helper/packaging/fetch_component_catalog.py "${args[@]}"
          catalog_sha256="$(python - workspace-catalog/component-catalog-release.json <<'PY'
          import json, os, re, sys
          metadata = json.load(open(sys.argv[1], encoding="utf-8"))
          digest = metadata.get("catalogSha256")
          channel = os.environ["CHANNEL"]
          commit = metadata.get("sourceCommit")
          allowed_refs = {"preview": {"refs/heads/develop"}, "stable": {"refs/heads/main", "refs/heads/release"}}
          if not isinstance(digest, str) or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("verified catalog metadata has an invalid digest")
          if metadata.get("repository") != "DoHorizon-AI/Cyrene-Workspace" or metadata.get("workflow") != "DoHorizon-AI/Cyrene-Workspace/.github/workflows/component-catalog-release.yml":
              raise SystemExit("verified metadata does not identify the trusted catalog publisher")
          if metadata.get("channel") != channel or not isinstance(commit, str) or not re.fullmatch(r"[0-9a-f]{40}", commit):
              raise SystemExit("verified catalog release channel or source commit differs from Platform")
          if metadata.get("releaseId") != f"catalog-{channel}-{commit}" or metadata.get("sourceRef") not in allowed_refs[channel]:
              raise SystemExit("verified catalog release tag or source ref does not match its channel")
          if not isinstance(metadata.get("generation"), int) or isinstance(metadata.get("generation"), bool):
              raise SystemExit("verified catalog generation is not an integer")
          print(digest.removeprefix("sha256:"))
          PY
          )"
          actual="$(sha256sum workspace-catalog/governance/component-catalog-v1.json | cut -d ' ' -f 1)"
          test "$actual" = "$catalog_sha256"
          catalog_release_id="$(python - workspace-catalog/component-catalog-release.json <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["releaseId"])
          PY
          )"
          echo "catalog_sha256=$catalog_sha256" >> "$GITHUB_OUTPUT"
          echo "catalog_release_id=$catalog_release_id" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-workspace-component-catalog
          path: workspace-catalog
          if-no-files-found: error
          retention-days: 30

  native-components:
    if: github.event_name != 'pull_request'
    needs: [catalog-input]
    name: native components / ${{ matrix.target_id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target_id: linux-ubuntu-22.04-x86_64-systemd
          - runner: ubuntu-24.04
            target_id: linux-ubuntu-24.04-x86_64-systemd
    permissions:
      contents: read
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      SOURCE_REF: ${{ github.ref }}
      CHANNEL: ${{ github.ref == 'refs/heads/develop' && 'preview' || 'stable' }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      CATALOG_SHA256: ${{ needs.catalog-input.outputs.catalog_sha256 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: verified-workspace-component-catalog
          path: workspace-catalog
      - uses: dtolnay/rust-toolchain@1.96.1
        with:
          components: rustfmt, clippy
          target: x86_64-unknown-linux-gnu
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install release dependencies and verify immutable source inputs
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check build pyyaml pytest -r tooling/release/requirements.txt
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          case "$CHANNEL:$SOURCE_REF" in
            stable:refs/heads/main|stable:refs/heads/release|preview:refs/heads/develop) ;;
            *) echo "release channel does not match exact source ref" >&2; exit 2 ;;
          esac
          python - "$CATALOG_SHA256" workspace-catalog/component-catalog-release.json workspace-catalog/governance/component-catalog-v1.json <<'PY'
          import hashlib, json, sys
          expected = sys.argv[1]
          metadata = json.load(open(sys.argv[2], encoding="utf-8"))
          raw = open(sys.argv[3], "rb").read()
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected or metadata.get("catalogSha256") != f"sha256:{actual}":
              raise SystemExit("verified Workspace catalog artifact digest changed")
          PY
      - name: Build supported native target artifacts
        run: |
          set -euo pipefail
          python tooling/release/build_native_components.py \
            --repository . \
            --output "$RUNNER_TEMP/native-components" \
            --channel "$CHANNEL" --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT" \
            --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT" \
            --catalog workspace-catalog/governance/component-catalog-v1.json \
            --catalog-sha256 "$CATALOG_SHA256" \
            --target-id "${{ matrix.target_id }}"
      - uses: actions/upload-artifact@v4
        with:
          name: platform-native-${{ matrix.target_id }}
          path: ${{ runner.temp }}/native-components
          if-no-files-found: error
          retention-days: 30

  component-release:
    if: github.event_name != 'pull_request'
    needs: [native-components, catalog-input]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      packages: write
    env:
      SOURCE_COMMIT: ${{ github.sha }}
      SOURCE_REF: ${{ github.ref }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      GH_TOKEN: ${{ github.token }}
      CHANNEL: ${{ github.ref == 'refs/heads/develop' && 'preview' || 'stable' }}
      RELEASE_ID: ${{ (github.ref == 'refs/heads/develop' && 'preview-' || 'stable-') }}${{ github.sha }}
      IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      CATALOG_SHA256: ${{ needs.catalog-input.outputs.catalog_sha256 }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the verified immutable component catalog
        uses: actions/download-artifact@v4
        with:
          name: verified-workspace-component-catalog
          path: workspace-catalog

      - name: Verify source, channel, and catalog pins
        run: |
          set -euo pipefail
          OUTPUT_ROOT="$RUNNER_TEMP/component-release"
          echo "OUTPUT_ROOT=$OUTPUT_ROOT" >> "$GITHUB_ENV"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          case "$CHANNEL:$SOURCE_REF" in
            stable:refs/heads/main|stable:refs/heads/release|preview:refs/heads/develop) ;;
            *) echo "release channel does not match the exact source ref" >&2; exit 2 ;;
          esac
          test "$RELEASE_ID" = "$CHANNEL-$SOURCE_COMMIT"
          python - "$CATALOG_SHA256" workspace-catalog/component-catalog-release.json workspace-catalog/governance/component-catalog-v1.json <<'PY'
          import hashlib, json, sys
          expected = sys.argv[1]
          metadata = json.load(open(sys.argv[2], encoding="utf-8"))
          raw = open(sys.argv[3], "rb").read()
          actual = hashlib.sha256(raw).hexdigest()
          if actual != expected or metadata.get("catalogSha256") != f"sha256:{actual}":
              raise SystemExit("verified Workspace catalog artifact digest changed")
          PY
          mkdir -p "$OUTPUT_ROOT"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
          target: x86_64-unknown-linux-gnu

      - name: Set up Python release tools
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install release tooling dependencies
        run: python -m pip install --disable-pip-version-check build pyyaml pytest -r tooling/release/requirements.txt

      - name: Prove immutable release is enabled and unused
        env:
          CYRENE_IMMUTABLE_RELEASES_READ_TOKEN: ${{ secrets.CYRENE_IMMUTABLE_RELEASES_READ_TOKEN }}
        run: |
          set -euo pipefail
          python tooling/release/preflight_component_release.py \
            --repository "$SOURCE_REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --channel "$CHANNEL" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT" \
            --repository-root .

      - name: Enable user namespaces for authority acceptance
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run release test gates
        run: unshare --user --map-root-user cargo test --locked --workspace --all-targets

      - name: Download Ubuntu 22.04 and 24.04 native component builds
        uses: actions/download-artifact@v4
        with:
          pattern: platform-native-*
          path: ${{ runner.temp }}/component-release/native
          merge-multiple: true

      - name: Build and attest the Runtime Maintenance SDK bundle
        id: runtime-sdk
        run: |
          set -euo pipefail
          python tooling/release/build_runtime_sdk_bundle.py \
            --repository . \
            --output "$OUTPUT_ROOT/runtime-sdk"
          sdk_archive="$OUTPUT_ROOT/runtime-sdk/cyrene-runtime-maintenance-sdk-linux-ubuntu-24.04-x86_64-python-3.12-library.tar.gz"
          python tooling/release/component_descriptor.py \
            --component-id cyrene-runtime-maintenance-sdk \
            --version 0.1.0 \
            --channel "$CHANNEL" \
            --repository "$SOURCE_REPOSITORY" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --catalog workspace-catalog/governance/component-catalog-v1.json \
            --catalog-sha256 "$CATALOG_SHA256" \
            --target-json '{"os":"linux","osVersion":"24.04","distribution":"ubuntu","distributionVersion":"24.04","architecture":"x86_64","abi":"glibc-2.39","runtime":"python:3.12"}' \
            --artifact-kind python-bundle \
            --format tar.gz \
            --subject-name "$(basename "$sdk_archive")" \
            --output "$OUTPUT_ROOT/runtime-sdk/descriptor.json"
          mkdir -p "$OUTPUT_ROOT/native/artifacts" "$OUTPUT_ROOT/native/manifests"
          cp "$sdk_archive" "$OUTPUT_ROOT/native/artifacts/"
          python tooling/release/create_component_manifest.py \
            --descriptor "$OUTPUT_ROOT/runtime-sdk/descriptor.json" \
            --artifact "$sdk_archive" \
            --payload-root "$OUTPUT_ROOT/runtime-sdk/payload" \
            --output-dir "$OUTPUT_ROOT/native/manifests" > "$OUTPUT_ROOT/runtime-sdk/manifest-result.json"
          sdk_manifest_digest="$(python - "$OUTPUT_ROOT/runtime-sdk/manifest-result.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["manifestDigest"])
          PY
          )"
          echo "manifest_digest=$sdk_manifest_digest" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Verify unique OCI publication tags
        run: |
          set -euo pipefail
          for image in \
            ghcr.io/dohorizon-ai/cyrene-workspace-authority \
            ghcr.io/dohorizon-ai/cyrene-workspace-web-bff \
            ghcr.io/dohorizon-ai/cyrene-runtime-maintenance; do
            if docker buildx imagetools inspect "$image:$RELEASE_ID-$IMAGE_TAG" >/dev/null 2>&1; then
              echo "image tag already exists: $image:$RELEASE_ID-$IMAGE_TAG" >&2
              exit 2
            fi
          done

      - name: Build and push immutable Workspace Authority OCI image
        id: authority-image-build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: framework/crates/cy-workspace-authority-host/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dohorizon-ai/cyrene-workspace-authority:${{ env.RELEASE_ID }}-${{ env.IMAGE_TAG }}
          labels: |
            io.cyrene.component.id=cy-workspace-authority-host
            io.cyrene.component.target-id=windows-10.0-x86_64-docker-linux
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_ID }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
            COMPONENT_VERSION=0.1.0
          provenance: mode=max
          sbom: true

      - name: Attest Workspace Authority OCI image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/dohorizon-ai/cyrene-workspace-authority
          subject-digest: ${{ steps.authority-image-build.outputs.digest }}
          push-to-registry: true
          github-token: ${{ github.token }}

      - name: Build and push immutable Web BFF OCI image
        id: bff-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: framework/crates/cy-workspace-web-bff/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dohorizon-ai/cyrene-workspace-web-bff:${{ env.RELEASE_ID }}-${{ env.IMAGE_TAG }}
          labels: |
            io.cyrene.component.id=cy-workspace-web-bff
            io.cyrene.component.target-id=windows-10.0-x86_64-docker-linux
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_ID }}
          provenance: mode=max
          sbom: true

      - name: Attest Web BFF OCI image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/dohorizon-ai/cyrene-workspace-web-bff
          subject-digest: ${{ steps.bff-image.outputs.digest }}
          push-to-registry: true
          github-token: ${{ github.token }}

      - name: Read Runtime Maintenance component version
        id: runtime-version
        run: |
          set -euo pipefail
          version="$(python - "$OUTPUT_ROOT/native/manifests" <<'PY'
          import json, sys
          from pathlib import Path
          rows = [json.loads(path.read_text(encoding="utf-8")) for path in Path(sys.argv[1]).glob("*.manifest.json")]
          matches = [row for row in rows if row.get("componentId") == "cyrene-runtime-maintenance" and row.get("artifact", {}).get("kind") == "native-binary"]
          versions = {row["version"] for row in matches}
          if len(matches) != 2 or len(versions) != 1:
              raise SystemExit("expected matching Ubuntu 22.04/24.04 Runtime Maintenance manifests")
          print(next(iter(versions)))
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build and push Runtime Maintenance Linux OCI broker image
        id: runtime-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tooling/release/Dockerfile.runtime-maintenance
          platforms: linux/amd64
          push: true
          tags: ghcr.io/dohorizon-ai/cyrene-runtime-maintenance:${{ env.RELEASE_ID }}-${{ env.IMAGE_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ env.RELEASE_ID }}
            io.cyrene.component.version=${{ steps.runtime-version.outputs.version }}
          provenance: mode=max
          sbom: true

      - name: Attest Runtime Maintenance OCI image
        uses: actions/attest@v4
        with:
          subject-name: ghcr.io/dohorizon-ai/cyrene-runtime-maintenance
          subject-digest: ${{ steps.runtime-image.outputs.digest }}
          push-to-registry: true
          github-token: ${{ github.token }}

      - name: Generate checksum subjects for native and SDK bundles
        run: |
          set -euo pipefail
          (cd "$OUTPUT_ROOT/native/artifacts" && sha256sum ./*.tar.gz | sed 's#  \./#  #') \
            > "$RUNNER_TEMP/component-payload-checksums.txt"

      - name: Attest native and SDK bundle payloads
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ runner.temp }}/component-payload-checksums.txt
          github-token: ${{ github.token }}

      - name: Create attestable OCI manifests
        env:
          AUTHORITY_DIGEST: ${{ steps.authority-image-build.outputs.digest }}
          BFF_DIGEST: ${{ steps.bff-image.outputs.digest }}
          RUNTIME_DIGEST: ${{ steps.runtime-image.outputs.digest }}
        run: |
          set -euo pipefail
          make_oci_manifest() {
            component_id="$1" image_repository="$2" digest="$3" target="$4"
            version="$(python - "$OUTPUT_ROOT/native/manifests" "$component_id" <<'PY'
          import json, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          component = sys.argv[2]
          matches = [
              json.loads(path.read_text(encoding="utf-8"))
              for path in root.glob("*.manifest.json")
              if json.loads(path.read_text(encoding="utf-8")).get("componentId") == component
              and json.loads(path.read_text(encoding="utf-8")).get("artifact", {}).get("kind") == "native-binary"
          ]
          if len(matches) != 1:
              raise SystemExit(f"expected one native release manifest for {component}, got {len(matches)}")
          print(matches[0]["version"])
          PY
          )"
            args=(
              --component-id "$component_id" --version "$version"
              --channel "$CHANNEL" --repository "$SOURCE_REPOSITORY"
              --source-ref "$SOURCE_REF" --source-commit "$SOURCE_COMMIT"
              --run-id "$RUN_ID" --run-attempt "$RUN_ATTEMPT"
              --catalog workspace-catalog/governance/component-catalog-v1.json
              --catalog-sha256 "$CATALOG_SHA256"
              --target-json "$target"
              --artifact-kind oci-image --subject-name "$image_repository"
              --oci-repository "$image_repository" --oci-digest "$digest"
              --oci-platform-json '{"os":"linux","architecture":"amd64"}'
              --output "$OUTPUT_ROOT/descriptor-$component_id.json"
            )
            python tooling/release/component_descriptor.py "${args[@]}"
            python tooling/release/create_component_manifest.py \
              --descriptor "$OUTPUT_ROOT/descriptor-$component_id.json" \
              --output-dir "$OUTPUT_ROOT/native/manifests"
          }
          windows_docker_target='{"os":"windows","osVersion":"10.0","architecture":"x86_64","runtime":"docker-desktop:linux"}'
          make_oci_manifest cy-workspace-authority-host ghcr.io/dohorizon-ai/cyrene-workspace-authority "$AUTHORITY_DIGEST" "$windows_docker_target"
          make_oci_manifest cy-workspace-web-bff ghcr.io/dohorizon-ai/cyrene-workspace-web-bff "$BFF_DIGEST" "$windows_docker_target"
          make_oci_manifest cyrene-runtime-maintenance ghcr.io/dohorizon-ai/cyrene-runtime-maintenance "$RUNTIME_DIGEST" "$windows_docker_target"

      - name: Create and attest the immutable component index
        run: |
          set -euo pipefail
          python tooling/release/component_artifacts.py index \
            --manifest-dir "$OUTPUT_ROOT/native/manifests" \
            --channel "$CHANNEL" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --workflow "$SOURCE_REPOSITORY/.github/workflows/component-release.yml" \
            --output "$OUTPUT_ROOT/component-release-index-v1.json"

      - name: Validate release documents against the pinned Workspace schemas
        run: |
          set -euo pipefail
          for manifest in "$OUTPUT_ROOT/native/manifests"/*.manifest.json; do
            python tooling/release/validate_component_schema.py \
              --kind manifest \
              --document "$manifest" \
              --schema-dir workspace-catalog/governance
          done
          python tooling/release/validate_component_schema.py \
            --kind index \
            --document "$OUTPUT_ROOT/component-release-index-v1.json" \
            --schema-dir workspace-catalog/governance

      - name: Generate the exact component index checksum subject
        run: |
          set -euo pipefail
          (cd "$OUTPUT_ROOT" && sha256sum component-release-index-v1.json) \
            > "$RUNNER_TEMP/component-index-checksum.txt"

      - name: Attest the exact component index bytes
        uses: actions/attest@v4
        with:
          subject-checksums: ${{ runner.temp }}/component-index-checksum.txt
          github-token: ${{ github.token }}

      - name: Create the draft release with all durable assets
        id: release
        run: |
          set -euo pipefail
          release_args=(
            "$RELEASE_ID"
            "$OUTPUT_ROOT/native/artifacts"/*.tar.gz \
            "$OUTPUT_ROOT/native/manifests"/*.manifest.json \
            "$OUTPUT_ROOT/component-release-index-v1.json" \
            --draft \
            --target "$SOURCE_COMMIT" \
            --title "Cyrene component release $RELEASE_ID" \
            --notes "Immutable component release for source $SOURCE_COMMIT on $SOURCE_REF. Assets are addressed by manifest digests and verified GitHub artifact attestations."
          )
          if [ "$CHANNEL" = preview ]; then release_args+=(--prerelease); fi
          gh release create "${release_args[@]}"
          release_id="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$RELEASE_ID" --jq .id)"
          gh api --method PATCH "repos/$SOURCE_REPOSITORY/releases/$release_id" -F draft=false >/dev/null
          immutable="$(gh api "repos/$SOURCE_REPOSITORY/releases/tags/$RELEASE_ID" --jq .immutable)"
          if [ "$immutable" != true ]; then
            echo "GitHub did not mark the published release immutable" >&2
            exit 2
          fi
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Reverify the published index and every release manifest
        run: |
          set -euo pipefail
          python tooling/release/component_artifacts.py verify-index \
            --index "$OUTPUT_ROOT/component-release-index-v1.json" \
            --catalog workspace-catalog/governance/component-catalog-v1.json \
            --verify-run \
            --verify-attestation
          for manifest in "$OUTPUT_ROOT/native/manifests"/*.manifest.json; do
            artifact_name="$(python - "$manifest" <<'PY'
          import json, sys
          from urllib.parse import urlparse
          doc = json.load(open(sys.argv[1], encoding="utf-8"))
          artifact = doc["artifact"]
          print(urlparse(artifact["uri"]).path.rsplit("/", 1)[-1] if artifact["kind"] != "oci-image" else "")
          PY
          )"
            verify_args=(--manifest "$manifest" --catalog workspace-catalog/governance/component-catalog-v1.json --verify-run --verify-attestation)
            if [ -n "$artifact_name" ]; then verify_args+=(--artifact "$OUTPUT_ROOT/native/artifacts/$artifact_name"); fi
            python tooling/release/component_artifacts.py verify "${verify_args[@]}"
          done

      - name: Summarize immutable release identity
        run: |
          set -euo pipefail
          python - "$OUTPUT_ROOT/component-release-index-v1.json" <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          index = json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"## {index['channel']} component release")
          print(f"\nSource: `{index['source']['repository']}@{index['source']['commit']}` ({index['source']['ref']})")
          print(f"\nIndex digest: `{index['indexDigest']}`\n")
          for release in index['releases']:
              print(f"- `{release['componentId']}` `{release['version']}` `{release['manifestDigest']}` — {release['manifestUri']}")
          PY

  pull-request-build:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Check out the fixed catalog verifier and schemas
        uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Workspace
          ref: ${{ env.CATALOG_HELPER_SOURCE_COMMIT }}
          path: catalog-helper
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            packaging/fetch_component_catalog.py
            packaging/catalog_metadata.py
            packaging/component_updates.py
            governance/component-catalog-v1.json
            governance/component-catalog-v1.schema.json
            governance/component-release-manifest-v1.schema.json
            governance/component-release-manifest-v2.schema.json
            governance/component-release-index-v1.schema.json
          sparse-checkout-cone-mode: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.1
          components: rustfmt, clippy
          target: x86_64-unknown-linux-gnu
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check build pyyaml pytest -r tooling/release/requirements.txt
      - name: Use pinned source catalog bytes for static pull request validation
        id: catalog
        run: |
          set -euo pipefail
          mkdir -p workspace-catalog/governance
          for schema in \
            component-catalog-v1.schema.json \
            component-release-manifest-v1.schema.json \
            component-release-manifest-v2.schema.json \
            component-release-index-v1.schema.json; do
            cp "catalog-helper/governance/$schema" workspace-catalog/governance/
          done
          cp catalog-helper/governance/component-catalog-v1.json workspace-catalog/governance/
          catalog_sha256="$(sha256sum workspace-catalog/governance/component-catalog-v1.json | cut -d ' ' -f 1)"
          echo "catalog_sha256=$catalog_sha256" >> "$GITHUB_OUTPUT"
      - name: Enable user namespaces for authority acceptance
        run: |
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Run workspace tests in a user namespace
        run: unshare --user --map-root-user cargo test --locked --workspace --all-targets
      - name: Validate component tooling and RFC 8785 fixtures
        env:
          CYRENE_COMPONENT_CATALOG: workspace-catalog/governance/component-catalog-v1.json
          CYRENE_COMPONENT_CATALOG_SHA256: ${{ steps.catalog.outputs.catalog_sha256 }}
        run: |
          set -euo pipefail
          python -m pytest tooling/release/tests -q
          python tooling/release/validate_component_schema.py \
            --kind manifest \
            --document tooling/release/tests/fixtures/component-release-manifest-v1.json \
            --schema-dir workspace-catalog/governance
          python tooling/release/validate_component_schema.py \
            --kind index \
            --document tooling/release/tests/fixtures/component-release-index-v1.json \
            --schema-dir workspace-catalog/governance
