name: Workspace Web BFF image build only

on:
  push:
    branches: [develop, main, release]
    paths:
      - "framework/**"
      - "contracts/**"
      - "kernel/**"
      - "runtime/**"
      - "agents/**"
      - "adapters/**"
      - "sdk/rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/workspace-web-bff-image-build.yml"
  pull_request:
    branches: [develop, main, release]
    paths:
      - "framework/**"
      - "contracts/**"
      - "kernel/**"
      - "runtime/**"
      - "agents/**"
      - "adapters/**"
      - "sdk/rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/workspace-web-bff-image-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-web-bff-image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the image source commit
        uses: actions/checkout@v5
        with:
          path: image-source
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out the pinned bundle builder and release lock
        uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Platform
          ref: 52732036c10898db23de7b4e20970a2896ddca70
          path: Cyrene-Platform
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned Product sources
        uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Catalyst
          ref: 8aa3432fc17fb0b1de50a4e0d5eb0ca37f4f21c9
          path: Cyrene-Services/Cyrene-Catalyst
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Echo
          ref: fcd641832d0d154c18e5ab5811ee7232d6d91fbc
          path: Cyrene-Services/Cyrene-Echo
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Exchange
          ref: 85e30c402151b8928ca2d17caaeef923b3669c77
          path: Cyrene-Services/Cyrene-Exchange
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Navigator
          ref: 05d7d88f3d38c21b1cb0641c66dc81fd033d4d2f
          path: Cyrene-Services/Cyrene-Navigator
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Reactor
          ref: 5f211b3a1eaec05dd14b47f5a2341816f61bbf51
          path: Cyrene-Services/Cyrene-Reactor
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Yield
          ref: 6b90c62675a0b54134512471cf0d1680989cf184
          path: Cyrene-Services/Cyrene-Yield
          persist-credentials: false

      - name: Set up Python for the offline bundle builder
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify lock pins and build the exact Product contract bundle
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}
          IMAGE_SOURCE: ${{ github.workspace }}/image-source
          PRODUCT_CONTRACT_OUTPUT: ${{ runner.temp }}/product-contracts-stage2
        run: |
          set -euo pipefail
          platform_root="$WORKSPACE_ROOT/Cyrene-Platform"
          lock="$platform_root/tooling/workspace-product-contract-bundle/releases/product-contract-bundle-stage2.json"
          tck_path="contracts/tck/distributed-workspace-fabric/v1/product-projections.tsv"
          tck_commit="267d48ebf42a89e2ebf11c7ea6d035e7c0985593"
          tck_sha256="ec75c976afd7261e4043eff5c1e53510580b6e90a9af71a07c2371413a984855"

          test "$(git -C "$platform_root" rev-parse HEAD)" = "52732036c10898db23de7b4e20970a2896ddca70"
          git -C "$platform_root" cat-file -e "$tck_commit^{commit}"
          locked_tck_sha256="$(git -C "$platform_root" show "$tck_commit:$tck_path" | sha256sum | cut -d ' ' -f 1)"
          builder_tck_sha256="$(sha256sum "$platform_root/$tck_path" | cut -d ' ' -f 1)"
          image_tck_sha256="$(sha256sum "$IMAGE_SOURCE/$tck_path" | cut -d ' ' -f 1)"
          test "$locked_tck_sha256" = "$tck_sha256"
          test "$builder_tck_sha256" = "$tck_sha256"
          test "$image_tck_sha256" = "$tck_sha256"

          python -m venv "$RUNNER_TEMP/product-contract-bundle-venv"
          "$RUNNER_TEMP/product-contract-bundle-venv/bin/python" -m pip install \
            --requirement "$platform_root/tooling/workspace-product-contract-bundle/requirements.txt"

          python "$platform_root/tooling/workspace-product-contract-bundle/build_bundle.py" \
            --source "Cyrene-Catalyst=$WORKSPACE_ROOT/Cyrene-Services/Cyrene-Catalyst" \
            --commit Cyrene-Catalyst=8aa3432fc17fb0b1de50a4e0d5eb0ca37f4f21c9 \
            --source "Cyrene-Yield=$WORKSPACE_ROOT/Cyrene-Services/Cyrene-Yield" \
            --commit Cyrene-Yield=6b90c62675a0b54134512471cf0d1680989cf184 \
            --source "Cyrene-Reactor=$WORKSPACE_ROOT/Cyrene-Services/Cyrene-Reactor" \
            --commit Cyrene-Reactor=5f211b3a1eaec05dd14b47f5a2341816f61bbf51 \
            --source "Cyrene-Exchange=$WORKSPACE_ROOT/Cyrene-Services/Cyrene-Exchange" \
            --commit Cyrene-Exchange=85e30c402151b8928ca2d17caaeef923b3669c77 \
            --source "Cyrene-Echo=$WORKSPACE_ROOT/Cyrene-Services/Cyrene-Echo" \
            --commit Cyrene-Echo=fcd641832d0d154c18e5ab5811ee7232d6d91fbc \
            --source "Cyrene-Navigator=$WORKSPACE_ROOT/Cyrene-Services/Cyrene-Navigator" \
            --commit Cyrene-Navigator=05d7d88f3d38c21b1cb0641c66dc81fd033d4d2f \
            --output "$PRODUCT_CONTRACT_OUTPUT"

          "$RUNNER_TEMP/product-contract-bundle-venv/bin/python" - \
            "$lock" "$PRODUCT_CONTRACT_OUTPUT/product-contract-bundle.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          lock_path, manifest_path = map(Path, sys.argv[1:])
          lock = json.loads(lock_path.read_text(encoding="utf-8"))
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected_repositories = [
              {"name": row["name"], "commit": row["commit"]}
              for row in lock["repositories"]
          ]
          assert manifest["canonicalTckSha256"] == lock["platformTck"]["sha256"]
          assert manifest["repositories"] == expected_repositories
          assert len(manifest["files"]) == 36
          print("Validated 36 contract files against the Stage 2 source lock.")
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the BFF image with the pinned bundle context
        uses: docker/build-push-action@v6
        with:
          context: ./image-source
          file: ./image-source/framework/crates/cy-workspace-web-bff/Dockerfile
          build-contexts: |
            product-contracts=${{ runner.temp }}/product-contracts-stage2
          tags: ghcr.io/dohorizon-ai/cyrene-workspace-web-bff:build-${{ github.sha }}
          push: false
          provenance: false

      - name: Record build-only result
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            printf 'Source commit: `%s`\n\n' "$SOURCE_SHA"
            printf 'Product bundle: Stage 2 lock `52732036c10898db23de7b4e20970a2896ddca70` with a BuildKit `product-contracts` context.\n\n'
            printf 'This workflow builds locally on the runner only. It does not log in to GHCR, publish an image, deploy to Azure, or assert production readiness.\n'
          } >> "$GITHUB_STEP_SUMMARY"
