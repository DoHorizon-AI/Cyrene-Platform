name: Workspace Web BFF image build only

on:
  push:
    branches: [develop, main, release]
    paths:
      - "framework/**"
      - "contracts/**"
      - "kernel/**"
      - "runtime/**"
      - "agents/**"
      - "adapters/**"
      - "sdk/rust/**"
      - "tooling/workspace-product-contract-bundle/**"
      - "tooling/release/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/workspace-web-bff-image-build.yml"
  pull_request:
    branches: [develop, main, release]
    paths:
      - "framework/**"
      - "contracts/**"
      - "kernel/**"
      - "runtime/**"
      - "agents/**"
      - "adapters/**"
      - "sdk/rust/**"
      - "tooling/workspace-product-contract-bundle/**"
      - "tooling/release/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/workspace-web-bff-image-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-web-bff-image-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Python for the pinned bundle verifier
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install bundle builder dependencies
        run: python -m pip install --disable-pip-version-check -r tooling/workspace-product-contract-bundle/requirements.txt

      - name: Rebuild Product contract context from exact lock SHAs
        id: product-contracts
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/workspace-product-contracts"
          python tooling/release/prepare_workspace_product_contracts.py \
            --repository . \
            --output "$output" \
            --checkout-root "$RUNNER_TEMP/pinned-product-sources"
          echo "root=$output" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Web BFF image only
        uses: docker/build-push-action@v6
        with:
          context: .
          file: framework/crates/cy-workspace-web-bff/Dockerfile
          build-contexts: |
            product-contracts=${{ steps.product-contracts.outputs.root }}
          platforms: linux/amd64
          push: false
          tags: ghcr.io/dohorizon-ai/cyrene-workspace-web-bff:build-${{ github.sha }}
          provenance: mode=max
          sbom: true
