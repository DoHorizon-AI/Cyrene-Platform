name: Architecture governance

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install CI prerequisites
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Install pinned Buf
        uses: bufbuild/buf-action@v1
        with:
          setup_only: true
          version: 1.45.0
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check architecture governance
        run: bash tooling/ci/check-architecture-governance.sh
      - name: Check Core v1 contract
        run: bash tooling/ci/check-core-v1-contract.sh
      - name: Check Kernel semantic contract
        env:
          REQUIRE_KOTLIN_TCK: "1"
        run: bash tooling/ci/check-kernel-semantic-contract.sh
