name: Workspace Sidecar binary artifact

on:
  push:
    branches: [develop, main, release]
  pull_request:
    branches: [develop, main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-sidecar-binary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  binary:
    name: Build immutable Linux Sidecar binary artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.96.1

      - name: Install native build prerequisites
        run: sudo apt-get update && sudo apt-get install --yes protobuf-compiler pkg-config libssl-dev perl make

      - name: Build only the Sidecar package
        run: cargo build --locked --release --package cy-workspace-sidecar

      - name: Prepare versioned binary and digest manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          install -m 0755 target/release/cy-workspace-sidecar dist/cy-workspace-sidecar
          package_version="$(cargo metadata --locked --no-deps --format-version 1 | python3 -c 'import json,sys; print(next(package["version"] for package in json.load(sys.stdin)["packages"] if package["name"] == "cy-workspace-sidecar"))')"
          binary_sha256="$(sha256sum dist/cy-workspace-sidecar | cut -d ' ' -f 1)"
          printf '%s  %s\n' "$binary_sha256" cy-workspace-sidecar > dist/SHA256SUMS
          python3 - "$SOURCE_SHA" "$package_version" "$binary_sha256" <<'PY'
          import json
          import sys
          from pathlib import Path

          source_sha, package_version, binary_sha256 = sys.argv[1:]
          manifest = {
              "schemaVersion": 1,
              "component": "cy-workspace-sidecar",
              "packageVersion": package_version,
              "sourceCommit": source_sha,
              "target": "x86_64-unknown-linux-gnu",
              "binary": "cy-workspace-sidecar",
              "sha256": binary_sha256,
          }
          Path("dist/manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload immutable Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: cy-workspace-sidecar-${{ github.sha }}-linux-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
