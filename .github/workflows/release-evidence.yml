name: Release Evidence

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]

permissions:
  pull-requests: read
  contents: read

jobs:
  main-release-entry:
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Validate release entry
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const labels = (pr.labels || []).map((label) => label.name);
            const body = pr.body || "";

            // 1. Branch gate: only develop can be merged into main
            if (pr.head.ref !== "develop") {
              core.setFailed(`main accepts release PRs only from develop (current head: ${pr.head.ref})`);
            }

            // 2. Release evidence verification label
            if (!labels.includes("release-evidence-verified")) {
              core.setFailed("missing release-evidence-verified label");
            }

            // 3. Release evidence URL in PR body
            if (!/Release evidence:\s*https?:\/\/[^\s)]+/i.test(body)) {
              core.setFailed("PR body must contain a Release evidence URL (e.g. 'Release evidence: https://...')");
            }

            // 4. Admin / Maintainer approval review
            const { data: prData } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            // Check if PR author is an administrator or maintainer of the repository
            let isPrivilegedAuthor = ["OWNER", "MEMBER"].includes(prData.author_association);
            try {
              const perm = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: prData.user.login,
              });
              const level = perm.data.permission; // "admin", "maintain", etc.
              if (["admin", "maintain"].includes(level)) {
                isPrivilegedAuthor = true;
              }
              core.info(`PR author ${prData.user.login} permission level: ${level}, isPrivilegedAuthor: ${isPrivilegedAuthor}`);
            } catch (err) {
              core.warning(`Could not fetch collaborator permission for ${prData.user.login}: ${err}`);
            }

            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const userLatestReview = new Map();
            for (const r of reviews.data) {
              userLatestReview.set(r.user.id, r);
            }

            const hasApproval = isPrivilegedAuthor || Array.from(userLatestReview.values()).some(
              (r) => r.state === "APPROVED" && ["OWNER", "MEMBER", "COLLABORATOR"].includes(r.author_association)
            );

            if (!hasApproval) {
              core.setFailed("main release PR requires approval (APPROVED review) from at least one repository administrator/maintainer");
            } else {
              core.info("Release evidence gate passed: valid branch, verified label, evidence link, and authorized approval.");
            }
