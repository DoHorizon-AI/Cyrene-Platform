name: cross-repo

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      cross_repo_required:
        description: "Enforce cross-repo validation (fail if credentials unavailable)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-repo-integration:
    name: cross-repo / plugins-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CROSS_REPO_REQUIRED: ${{ github.event.inputs.cross_repo_required || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check cross-repo credentials
        id: infra-check
        run: |
          if [ -n "${{ secrets.CYRENE_CROSS_REPO_TOKEN }}" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=SKIPPED_CREDENTIALS::secrets.CYRENE_CROSS_REPO_TOKEN is not configured in this environment."
          fi

      - name: Checkout exact Plugins runtime for cross-repository TCK
        id: checkout-plugins
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: DoHorizon-AI/Cyrene-Plugins-Official
          ref: 7906f2672a1b80620a32840bd95c81a9cc38352c
          path: .ci/plugins
          token: ${{ secrets.CYRENE_CROSS_REPO_TOKEN || github.token }}

      - name: Report cross-repo infrastructure failure
        if: steps.checkout-plugins.outcome != 'success'
        run: |
          if [ "$CROSS_REPO_REQUIRED" = "true" ]; then
            echo "::error title=CROSS_REPO_REQUIRED_FAILURE::Cross-repo validation is marked REQUIRED, but authentication failed to clone DoHorizon-AI/Cyrene-Plugins-Official."
            exit 1
          else
            echo "::notice title=CROSS_REPO_SKIPPED::Cross-repo plugins validation skipped due to missing cross-repo credentials (SKIPPED_CREDENTIALS). Release gates must verify cross-repo integration with active credentials."
          fi

      - name: Setup Rust Toolchain
        if: steps.checkout-plugins.outcome == 'success'
        uses: dtolnay/rust-toolchain@stable

      - name: Run cross-repository Plugins TCK
        if: steps.checkout-plugins.outcome == 'success'
        env:
          CYRENE_PLUGINS_WORKTREE: ${{ github.workspace }}/.ci/plugins
        run: cargo test --locked -p cy-capability-execution-service --test plugins_model_provider_tck
