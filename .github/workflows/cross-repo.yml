name: cross-repo

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main, feat/*]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cross-repo-integration:
    name: cross-repo / plugins-integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Require cross-repo credentials
        env:
          CROSS_REPO_TOKEN: ${{ secrets.CYRENE_CROSS_REPO_TOKEN }}
        run: |
          if [ -z "$CROSS_REPO_TOKEN" ]; then
            echo "::error title=CROSS_REPO_REQUIRED_FAILURE::secrets.CYRENE_CROSS_REPO_TOKEN is missing for the required private-repository checkout."
            exit 1
          fi

      - name: Checkout exact Plugins runtime for cross-repository TCK
        uses: actions/checkout@v5
        with:
          repository: DoHorizon-AI/Cyrene-Plugins-Official
          ref: 261a78fd36c7cb2da85a504a89ec7c9c353ecc19
          path: .ci/plugins
          token: ${{ secrets.CYRENE_CROSS_REPO_TOKEN }}

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run cross-repository Plugins TCK
        env:
          CYRENE_PLUGINS_WORKTREE: ${{ github.workspace }}/.ci/plugins
        run: cargo test --locked -p cy-capability-execution-service --test plugins_model_provider_tck -- --ignored --nocapture
