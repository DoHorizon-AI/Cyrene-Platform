name: Immutable Workspace Product policy release

on:
  workflow_dispatch:
  push:
    branches: [develop, main, release]
    paths:
      - contracts/policies/workspace-product-policy-v2.json
      - .github/workflows/product-policy-release.yml
      - tooling/release/preflight_component_release.py
  pull_request:
    branches: [develop, main, release]
    paths:
      - contracts/policies/workspace-product-policy-v2.json
      - .github/workflows/product-policy-release.yml
      - tooling/release/preflight_component_release.py

permissions:
  contents: read

concurrency:
  group: product-policy-v2-${{ github.repository }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish-policy:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    env:
      REPOSITORY: ${{ github.repository }}
      SOURCE_COMMIT: ${{ github.sha }}
      SOURCE_REF: ${{ github.ref }}
      CHANNEL: ${{ github.ref == 'refs/heads/develop' && 'preview' || 'stable' }}
      RELEASE_ID: product-policy-v2-${{ github.ref == 'refs/heads/develop' && 'preview' || 'stable' }}-${{ github.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify exact source channel and immutable release preflight
        env:
          CYRENE_IMMUTABLE_RELEASES_READ_TOKEN: ${{ secrets.CYRENE_IMMUTABLE_RELEASES_READ_TOKEN }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          case "$CHANNEL:$SOURCE_REF" in
            stable:refs/heads/main|stable:refs/heads/release|preview:refs/heads/develop) ;;
            *) echo "policy release channel does not match source ref" >&2; exit 2 ;;
          esac
          python tooling/release/preflight_component_release.py \
            --repository "$REPOSITORY" \
            --release-id "$RELEASE_ID" \
            --release-namespace product-policy-v2 \
            --channel "$CHANNEL" \
            --source-ref "$SOURCE_REF" \
            --source-commit "$SOURCE_COMMIT" \
            --repository-root .
      - name: Stage exact policy subject
        id: subject
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/product-policy-v2"
          install -m 0644 contracts/policies/workspace-product-policy-v2.json \
            "$RUNNER_TEMP/product-policy-v2/workspace-product-policy-v2.json"
          echo "path=$RUNNER_TEMP/product-policy-v2/workspace-product-policy-v2.json" >> "$GITHUB_OUTPUT"
      - name: Attest exact policy subject
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.subject.outputs.path }}
      - name: Download and verify detached policy attestation
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/product-policy-v2"
          subject=workspace-product-policy-v2.json
          digest="sha256:$(sha256sum "$subject" | cut -d ' ' -f 1)"
          gh attestation download "$subject" --repo "$REPOSITORY" --predicate-type https://slsa.dev/provenance/v1
          mv "$digest.jsonl" workspace-product-policy-v2.attestation.jsonl
          gh attestation verify "$subject" --repo "$REPOSITORY" \
            --bundle workspace-product-policy-v2.attestation.jsonl \
            --signer-workflow "$REPOSITORY/.github/workflows/product-policy-release.yml" \
            --source-ref "$SOURCE_REF" --source-digest "$SOURCE_COMMIT" \
            --predicate-type https://slsa.dev/provenance/v1
          python - "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$SOURCE_REF" "$SOURCE_COMMIT" "$REPOSITORY" <<'PY'
          import hashlib, json, sys
          from pathlib import Path
          run_id, attempt, ref, commit, repository = sys.argv[1:]
          root = Path.cwd()
          policy = (root / "workspace-product-policy-v2.json").read_bytes()
          bundle = (root / "workspace-product-policy-v2.attestation.jsonl").read_bytes()
          subject = f"{repository}/contracts/policies/workspace-product-policy-v2.json"
          run_url = f"https://github.com/{repository}/actions/runs/{run_id}/attempts/{attempt}"
          proof = {
              "source": {"repository": repository, "ref": ref, "commit": commit},
              "policy": {"path": "workspace-product-policy-v2.json", "sha256": "sha256:" + hashlib.sha256(policy).hexdigest()},
              "provenance": {
                  "attestation": {"attestation": {
                      "kind": "github-artifact-attestation",
                      "subjectName": "workspace-product-policy-v2.json",
                      "repository": repository,
                      "workflow": f"{repository}/.github/workflows/product-policy-release.yml",
                      "predicateType": "https://slsa.dev/provenance/v1",
                      "run": {"id": run_id, "attempt": int(attempt), "url": run_url},
                  }},
                  "bundlePath": "attestations/platform-policy.jsonl",
                  "bundleSha256": "sha256:" + hashlib.sha256(bundle).hexdigest(),
                  "subjectPath": subject,
                  "subjectDigest": "sha256:" + hashlib.sha256(policy).hexdigest(),
              },
          }
          (root / "attestations").mkdir()
          (root / proof["provenance"]["bundlePath"]).write_bytes(bundle)
          (root / "policy-publication-v1.json").write_text(json.dumps(proof, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Publish immutable policy proof assets
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/product-policy-v2"
          gh release create "$RELEASE_ID" \
            workspace-product-policy-v2.json \
            workspace-product-policy-v2.attestation.jsonl \
            policy-publication-v1.json \
            --repo "$REPOSITORY" \
            --draft --target "$SOURCE_COMMIT" \
            --title "Workspace Product policy $RELEASE_ID" \
            --notes "Immutable policy bytes and independently verifiable source attestation for $REPOSITORY@$SOURCE_COMMIT."
          release_id="$(gh release view "$RELEASE_ID" --repo "$REPOSITORY" --json databaseId --jq .databaseId)"
          gh api --method PATCH "repos/$REPOSITORY/releases/$release_id" -F draft=false >/dev/null
          test "$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_ID" --jq .immutable)" = true
