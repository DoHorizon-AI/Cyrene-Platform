name: Prepare Component Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release Version (e.g. 0.4.3 or v0.4.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare-release:
    name: release / prepare-draft-release
    runs-on: ubuntu-latest
    environment: public-release
    steps:
      - name: Checkout Source at Default Branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Tooling Dependencies
        run: |
          python -m pip install --upgrade pip pytest hypothesis pyyaml

      - name: Run Full Release Verification
        run: |
          python tooling/ci/verify.py

      - name: Validate Release Version & Prepare Annotated Tag
        run: |
          python tooling/release/prepare_release.py             --repo-path .             --version "${{ github.event.inputs.version }}"

      - name: Push Release Tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="${VERSION#v}"
          TAG="v${TAG}"
          git push origin "${TAG}"

      - name: Create Draft GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version }}"
          TAG="${VERSION#v}"
          TAG="v${TAG}"
          gh release create "${TAG}"             --draft             --title "Cyrene Platform ${TAG}"             --notes "Automated component release for Cyrene Platform at commit ${{ github.sha }}"
