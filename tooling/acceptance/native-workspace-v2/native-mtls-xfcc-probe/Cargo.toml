[package]
name = "native-mtls-xfcc-probe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
cy-proto = { version = "0.1.0", path = "../../../../contracts/rust/cy-proto", default-features = false }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.12.3", features = ["transport", "tls"] }
