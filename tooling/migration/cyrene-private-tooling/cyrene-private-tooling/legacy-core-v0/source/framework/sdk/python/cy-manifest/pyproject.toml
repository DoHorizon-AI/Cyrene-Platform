[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cy-manifest"
version = "0.1.0"
description = "Core CYRENE manifest models with deterministic canonical hashing (matches the Rust contract crate byte-for-byte)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0,<3.0.0",
    "PyYAML>=6.0",
    "jcs>=0.2.1,<0.3.0",
]

[project.scripts]
cy-manifest = "cy_manifest.hash:main"

[tool.setuptools.packages.find]
where = ["src"]
