[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cy_plugin_sdk"
version = "0.1.0"
description = "CYRENE Plugin SDK and Protocol Codec"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "protobuf>=4.21.0",
]

[tool.setuptools.packages.find]
where = ["src"]
