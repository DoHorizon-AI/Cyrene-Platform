[pytest]
minversion = 7.0
testpaths =
    tests
    framework/sdk/python/cy-manifest/tests
pythonpath =
    framework/sdk/python/cy-manifest/src
    framework/sdk/python/cy-plugin-sdk/src
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    -m "not gpu and not integration and not uds"
markers =
    asyncio: marks asynchronous tests (provided by pytest-asyncio)
    gpu: marks tests that require GPU
    integration: marks integration tests
    slow: marks slow tests
    uds: marks tests that require Unix domain sockets
    unit: marks unit tests
