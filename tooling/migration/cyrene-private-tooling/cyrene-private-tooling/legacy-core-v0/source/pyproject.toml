[project]
name = "cyrene-core-workspace"
version = "0.1.0"
description = "CYRENE core contracts and Python SDK workspace."
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false
default-groups = ["dev"]

[tool.uv.workspace]
members = [
    "framework/sdk/python/cy-manifest",
    "framework/sdk/python/cy-plugin-sdk",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "mypy>=1.7.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
