[pytest]
minversion = 7.0
testpaths =
    tests
    python/cy_exec/tests
    python/cy_gateway_lite/tests
    python/cy_manifest/tests
pythonpath =
    python/cy_exec/src
    python/cy_gateway_lite/src
    python/cy_manifest/src
    python/plugins/community
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    -m "not gpu and not integration and not uds"
markers =
    asyncio: marks asynchronous tests (provided by pytest-asyncio)
    gpu: marks tests that require GPU
    integration: marks integration tests
    slow: marks slow tests
    uds: marks tests that require Unix domain sockets
    unit: marks unit tests
