# Preservation-only validation for private support source.
parameters:
  - name: coreRepository
    type: string
    default: cyrene-org/cyrene-core
  - name: coreServiceConnection
    type: string
    default: cyrene-core-github
  - name: coreRef
    type: string
    default: refs/heads/main

trigger:
  branches:
    include: [main, develop]

resources:
  repositories:
    - repository: cyreneCore
      type: github
      endpoint: ${{ parameters.coreServiceConnection }}
      name: ${{ parameters.coreRepository }}
      ref: ${{ parameters.coreRef }}

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    path: s/component
  - checkout: cyreneCore
    path: s/cyrene-core
  - script: >-
      cargo metadata
      --manifest-path "$(Pipeline.Workspace)/s/cyrene-core/Cargo.toml"
      --locked --no-deps --format-version 1
    displayName: Resolve referenced CYRENE core workspace
  - pwsh: |
      $files = Get-ChildItem -LiteralPath "$(Pipeline.Workspace)/s/component" -Recurse -File
      if (-not $files) { throw "Repository contains no preserved source." }
      Write-Host "Preserved source inventory contains $($files.Count) files."
    displayName: Audit preserved source inventory
