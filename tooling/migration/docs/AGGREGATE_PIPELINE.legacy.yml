# Migration checkpoint only: validates contracts and preserved source markers.
# It does not build, deploy, or certify any advanced service.
parameters:
  - name: coreRepository
    type: string
    default: cyrene-org/cyrene-core
  - name: coreServiceConnection
    type: string
    default: cyrene-core-github
  - name: coreRef
    type: string
    default: refs/heads/main

trigger:
  branches:
    include:
      - main
      - develop
  paths:
    include:
      - services/**
      - plugins/**
      - azure-pipelines.yml

pr:
  paths:
    include:
      - services/**
      - plugins/**
      - azure-pipelines.yml

resources:
  repositories:
    - repository: cyreneCore
      type: github
      endpoint: ${{ parameters.coreServiceConnection }}
      name: ${{ parameters.coreRepository }}
      ref: ${{ parameters.coreRef }}

pool:
  vmImage: ubuntu-latest

steps:
  - checkout: self
    path: s/advanced-services
  - checkout: cyreneCore
    path: s/cyrene-core

  - task: UsePythonVersion@0
    inputs:
      versionSpec: "3.12"
    displayName: Use Python 3.12

  - script: |
      python "$(Pipeline.Workspace)/s/cyrene-core/framework/tooling/validate_advanced_service.py" \
        --schema "$(Pipeline.Workspace)/s/cyrene-core/contracts/schemas/advanced-service.schema.json" \
        "$(Pipeline.Workspace)/s/advanced-services/services/catalyst/service.json" \
        "$(Pipeline.Workspace)/s/advanced-services/services/yield/service.json" \
        "$(Pipeline.Workspace)/s/advanced-services/services/reactor/service.json" \
        "$(Pipeline.Workspace)/s/advanced-services/services/exchange/service.json" \
        "$(Pipeline.Workspace)/s/advanced-services/services/navigator/service.json" \
        "$(Pipeline.Workspace)/s/advanced-services/services/echo/service.json"
    displayName: Validate migration manifests with referenced core contracts

  - pwsh: |
      $root = "$(Pipeline.Workspace)/s/advanced-services"
      $markers = @(
        "services/catalyst/legacy/CY_LLM_Training/dialogue_gi/README.md",
        "services/yield/legacy/cy-exec-training/src/cy_exec/training",
        "services/reactor/legacy/cy-exec/src/cy_exec/engines",
        "services/exchange/legacy/rust/cy-gateway/Cargo.toml",
        "services/navigator/legacy-dh/crates/dh-core/Cargo.toml",
        "services/echo/legacy/navigator-feedback/desktop-tauri/feedback.rs"
      )
      foreach ($marker in $markers) {
        $path = Join-Path $root $marker
        if (-not (Test-Path -LiteralPath $path)) {
          throw "Missing preserved source marker: $marker"
        }
      }
      Write-Host "All six preserved-source markers are present."
    displayName: Audit six preserved source roots
