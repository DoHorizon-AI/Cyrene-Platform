[package]
name = "cy-artifact-transfer"
version = "0.1.0"
edition = "2021"
description = "Resumable HTTPS Range transfer for canonical Cyrene Artifacts."
license = "Apache-2.0"

[dependencies]
cy-kernel-contract = { path = "../../../contracts/rust/cy-kernel-contract" }
cy-manifest = { path = "../../../contracts/rust/cy-manifest" }
reqwest = { version = "0.11", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[dev-dependencies]
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
tempfile = "3.8"
