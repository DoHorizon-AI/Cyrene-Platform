[package]
name = "cy-artifact-transfer"
version = "0.1.0"
edition = "2021"
description = "Resumable HTTPS Range transfer for canonical Cyrene Artifacts."
license = "Apache-2.0"
repository = "https://github.com/DoHorizon-AI/Cyrene-Platform"

[dependencies]
cy-kernel-contract = { version = "0.1.0", path = "../../../contracts/rust/cy-kernel-contract" }
cy-manifest = { version = "0.1.0", path = "../../../contracts/rust/cy-manifest" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
jsonschema = { version = "0.18", default-features = false, features = ["draft202012"] }
tempfile = "3.8"
