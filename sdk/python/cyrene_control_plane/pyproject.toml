[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-control-plane"
version = "0.1.0"
description = "Generic Cyrene Product Control Plane contracts and reference store"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
