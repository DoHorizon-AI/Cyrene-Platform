[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-runtime-maintenance"
version = "0.1.0"
description = "Cyrene runtime update readiness and task admission client"
license = { text = "AGPL-3.0-only" }
readme = "README.md"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
