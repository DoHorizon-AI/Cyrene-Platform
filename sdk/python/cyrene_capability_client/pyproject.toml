[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-capability-client"
version = "0.1.0"
description = "Product-facing Python client for the canonical Cyrene Capability Execution Service"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.83.1,<2.0.0",
    "protobuf>=7.36.1,<8.0.0",
]

[project.optional-dependencies]
dev = [
    "grpcio-tools==1.83.1",
    "pytest>=8.0.0,<10.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F63", "F7"]
ignore = []
