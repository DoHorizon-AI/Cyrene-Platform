[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cyrene-environment"
version = "0.1.0"
description = "Provider-neutral reproducible environment contract and resolver"
requires-python = ">=3.11"
dependencies = ["cyrene-artifacts>=0.1.0"]

[tool.setuptools.packages.find]
where = ["src"]
