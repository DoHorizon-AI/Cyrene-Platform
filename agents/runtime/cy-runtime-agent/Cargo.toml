[package]
name = "cy-runtime-agent"
version = "0.1.0"
edition = "2021"
description = "Unprivileged outbound Runtime Agent for container-only execution."
license = "AGPL-3.0-only"

[lib]
name = "cy_runtime_agent"
path = "src/lib.rs"

[[bin]]
name = "cy-runtime-agent"
path = "src/main.rs"

[dependencies]
cy-artifact-transfer = { path = "../../../sdk/rust/cy-artifact-transfer" }
cy-execution-fabric = { path = "../../../framework/crates/cy-execution-fabric" }
cy-kernel-contract = { path = "../../../contracts/rust/cy-kernel-contract" }
cy-proto = { path = "../../../contracts/rust/cy-proto" }
nix = { version = "0.29", features = ["process", "signal"] }
prost-types = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
rustix = { version = "1", features = ["fs", "process"] }
thiserror = "1.0"
tokio = { version = "1.35", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tonic = { version = "0.11", features = ["transport", "tls"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.8"

[[bin]]
name = "cy-runtime-control-fixture"
path = "src/bin/cy-runtime-control-fixture.rs"
