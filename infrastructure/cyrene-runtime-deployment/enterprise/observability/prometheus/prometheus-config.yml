# Prometheus configuration for the Pro enterprise compose stack.

rule_files:
  - /etc/prometheus/rules/cy-llm-alerts.yml

scrape_configs:
  - job_name: cy-llm-pro-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway:8080]

  - job_name: cy-llm-pro-coordinator
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [coordinator:8081]

  - job_name: cy-llm-pro-worker
    metrics_path: /metrics
    static_configs:
      - targets: [worker-nvidia:9090]

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
