services:
  # Community Compose is intentionally a development/insecure baseline.
  # Set CY_LLM_INTERNAL_TOKEN and use a separately hardened deployment for production.
  gateway-lite:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway-lite
    image: cy-llm-gateway-lite:dev
    environment:
      COORDINATOR_GRPC_ADDR: coordinator-lite:50051
      GATEWAY_API_TOKEN: ${GATEWAY_API_TOKEN:-}
      GATEWAY_REQUEST_TIMEOUT: ${GATEWAY_REQUEST_TIMEOUT:-60}
      CY_LLM_INTERNAL_TOKEN: ${CY_LLM_INTERNAL_TOKEN:-}
      CY_LLM_ENV: development
      CY_LLM_ALLOW_INSECURE_INTERNAL_TOKEN: "true"
    ports:
      - "${CY_LLM_LITE_PORT:-8000}:8000"
    depends_on:
      - coordinator-lite
    networks:
      - cy-llm-lite

  coordinator-lite:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.gateway-lite
    image: cy-llm-coordinator-lite:dev
    command: ["python", "-m", "cy_gateway_lite.coordinator"]
    environment:
      COORDINATOR_GRPC_BIND: 0.0.0.0:50051
      WORKER_GRPC_ADDRS: worker:50052
      CY_LLM_INTERNAL_TOKEN: ${CY_LLM_INTERNAL_TOKEN:-}
      CY_LLM_ENV: development
      CY_LLM_ALLOW_INSECURE_INTERNAL_TOKEN: "true"
    ports:
      - "${CY_LLM_LITE_COORDINATOR_PORT:-50051}:50051"
    depends_on:
      - worker
    networks:
      - cy-llm-lite

  worker:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.cy-exec
    image: cy-llm-cy-exec:dev
    command: ["python", "-m", "cy_exec.main", "--serve", "--port", "50052"]
    environment:
      CY_LLM_ENGINE: ${CY_LLM_ENGINE:-nvidia}
      CY_LLM_DEFAULT_MODEL: ${CY_LLM_DEFAULT_MODEL:-facebook/opt-2.7b}
      CY_LLM_MODEL_REGISTRY_PATH: /app/deploy/models.json
      CY_LLM_INTERNAL_TOKEN: ${CY_LLM_INTERNAL_TOKEN:-}
      CY_LLM_ENV: development
      CY_LLM_ALLOW_INSECURE_INTERNAL_TOKEN: "true"
      CY_LLM_HEALTH_PORT: "9090"
    volumes:
      - ../models.json:/app/deploy/models.json:ro
      - ${CY_LLM_MODEL_CACHE:-./models}:/models
      - ${CY_LLM_CHECKPOINT_DIR:-./checkpoints}:/checkpoints
    ports:
      - "${CY_LLM_LITE_WORKER_PORT:-50052}:50052"
      - "${CY_LLM_WORKER_METRICS_PORT:-19090}:9090"
    networks:
      - cy-llm-lite

networks:
  cy-llm-lite:
    driver: bridge
