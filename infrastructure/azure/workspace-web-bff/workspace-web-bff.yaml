# REVIEW-ONLY TEMPLATE. Intentionally unresolved placeholders make this file
# unsuitable for deployment until the gates in README.md are cleared.
location: eastasia
name: cyrene-workspace-web-bff
identity:
  type: SystemAssigned
properties:
  managedEnvironmentId: REPLACE_WITH_REVIEWED_INTERNAL_CAE_RESOURCE_ID
  configuration:
    activeRevisionsMode: Multiple
    secrets:
      - name: workspace-directory-database-url
        keyVaultUrl: https://REPLACE_WITH_KEY_VAULT_NAME.vault.azure.net/secrets/workspace-directory-database-url/REPLACE_WITH_VERSION
        identity: system
      - name: workspace-web-bff-csrf-mac-key
        keyVaultUrl: https://REPLACE_WITH_KEY_VAULT_NAME.vault.azure.net/secrets/workspace-web-bff-csrf-mac-key/REPLACE_WITH_VERSION
        identity: system
      - name: workspace-web-bff-relay-ca
        keyVaultUrl: https://REPLACE_WITH_KEY_VAULT_NAME.vault.azure.net/secrets/workspace-web-bff-relay-ca/REPLACE_WITH_VERSION
        identity: system
      - name: workspace-web-bff-relay-client-certificate
        keyVaultUrl: https://REPLACE_WITH_KEY_VAULT_NAME.vault.azure.net/secrets/workspace-web-bff-relay-client-certificate/REPLACE_WITH_VERSION
        identity: system
      - name: workspace-web-bff-relay-client-private-key
        keyVaultUrl: https://REPLACE_WITH_KEY_VAULT_NAME.vault.azure.net/secrets/workspace-web-bff-relay-client-private-key/REPLACE_WITH_VERSION
        identity: system
      - name: workspace-web-bff-handoff-signing-seed
        keyVaultUrl: https://REPLACE_WITH_KEY_VAULT_NAME.vault.azure.net/secrets/workspace-web-bff-handoff-signing-seed/REPLACE_WITH_VERSION
        identity: system
    ingress:
      external: false
      allowInsecure: false
      transport: http
      targetPort: 8080
      traffic:
        - latestRevision: true
          weight: 100
  template:
    containers:
      - name: workspace-web-bff
        image: ghcr.io/dohorizon-ai/cyrene-workspace-web-bff@sha256:REPLACE_WITH_REVIEWED_BUILD_DIGEST
        env:
          - name: CYRENE_WORKSPACE_WEB_BFF_CLIENT_ORIGIN
            value: REPLACE_WITH_EXACT_HTTPS_CLIENT_ORIGIN
          - name: CYRENE_WORKSPACE_WEB_BFF_AAD_TENANT_ID
            value: REPLACE_WITH_AAD_TENANT_UUID
          - name: CYRENE_WORKSPACE_WEB_BFF_AAD_AUDIENCE
            value: REPLACE_WITH_AAD_API_AUDIENCE
          - name: CYRENE_WORKSPACE_DIRECTORY_DATABASE_URL
            secretRef: workspace-directory-database-url
          - name: CYRENE_WORKSPACE_WEB_BFF_PRODUCT_CONTRACT_ROOT
            value: /opt/cyrene/product-contracts
          - name: CYRENE_WORKSPACE_WEB_BFF_RELAY_ENDPOINT
            value: REPLACE_WITH_TRUSTED_HTTPS_RELAY_ORIGIN
          - name: CYRENE_WORKSPACE_WEB_BFF_RELAY_SERVER_NAME
            value: REPLACE_WITH_EXACT_RELAY_TLS_SERVER_NAME
          - name: CYRENE_WORKSPACE_WEB_BFF_HANDOFF_ISSUER
            value: REPLACE_WITH_RELAY_TRUSTED_HANDOFF_ISSUER
          - name: CYRENE_WORKSPACE_WEB_BFF_HANDOFF_AUDIENCE
            value: REPLACE_WITH_RELAY_TRUSTED_HANDOFF_AUDIENCE
        probes:
          - type: Startup
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
            successThreshold: 1
          - type: Liveness
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          - type: Readiness
            httpGet:
              path: /readyz
              port: 8080
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 1
            successThreshold: 1
        resources:
          cpu: 0.25
          memory: 0.5Gi
        volumeMounts:
          - volumeName: workspace-web-bff-secrets
            mountPath: /mnt/cyrene-secret-input
    scale:
      minReplicas: 1
      maxReplicas: 3
    terminationGracePeriodSeconds: 30
    volumes:
      - name: workspace-web-bff-secrets
        storageType: Secret
        secrets:
          - secretRef: workspace-web-bff-csrf-mac-key
            path: csrf-mac-key
          - secretRef: workspace-web-bff-relay-ca
            path: relay-ca.pem
          - secretRef: workspace-web-bff-relay-client-certificate
            path: relay-client.crt
          - secretRef: workspace-web-bff-relay-client-private-key
            path: relay-client.key
          - secretRef: workspace-web-bff-handoff-signing-seed
            path: handoff-signing-seed
type: Microsoft.App/containerApps
