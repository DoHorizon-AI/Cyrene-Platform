# Review template for the internal Relay profile A in East Asia.
# Do not apply: this host requires PostgreSQL and its /readyz intentionally
# stays 503 until all production IAM, enrollment, and network gates are met.
# ProductHttpApiAdapter currently runs through WorkspaceConnector; this host
# denies Connector sessions, so BFF Frontend trust does not provide Product IO.
location: eastasia
name: cyrene-workspace-relay
identity:
  type: SystemAssigned
properties:
  managedEnvironmentId: REPLACE_WITH_EXISTING_CAE_RESOURCE_ID
  configuration:
    activeRevisionsMode: Multiple
    # Provision these values in Key Vault and grant this app identity
    # Key Vault Secrets User. No secret values belong in this template.
    secrets:
      - name: workspace-directory-database-url
        keyVaultUrl: https://REPLACE_WITH_KEY_VAULT.vault.azure.net/secrets/workspace-directory-database-url
        identity: system
      - name: workspace-directory-postgres-ca
        keyVaultUrl: https://REPLACE_WITH_KEY_VAULT.vault.azure.net/secrets/workspace-directory-postgres-ca
        identity: system
      - name: workspace-relay-bff-client-ca
        keyVaultUrl: https://REPLACE_WITH_KEY_VAULT.vault.azure.net/secrets/workspace-relay-bff-client-ca
        identity: system
      - name: workspace-relay-bff-certificate-allowlist
        keyVaultUrl: https://REPLACE_WITH_KEY_VAULT.vault.azure.net/secrets/workspace-relay-bff-certificate-allowlist
        identity: system
      # Prepared for a future registry-backed Connector adapter. Unused today.
      - name: workspace-relay-device-client-ca
        keyVaultUrl: https://REPLACE_WITH_KEY_VAULT.vault.azure.net/secrets/workspace-relay-device-client-ca
        identity: system
      - name: ghcr-pull-password
        keyVaultUrl: https://REPLACE_WITH_KEY_VAULT.vault.azure.net/secrets/ghcr-pull-password
        identity: system
    registries:
      - server: ghcr.io
        username: REPLACE_WITH_GHCR_PULL_USERNAME
        passwordSecretRef: ghcr-pull-password
    ingress:
      external: false
      allowInsecure: false
      clientCertificateMode: require
      transport: http2
      targetPort: 8080
      traffic:
        - latestRevision: true
          weight: 100
  template:
    containers:
      - name: workspace-relay
        image: ghcr.io/dohorizon-ai/cyrene-workspace-relay@sha256:REPLACE_WITH_PUBLISHED_DIGEST
        env:
          - name: CYRENE_WORKSPACE_RELAY_BIND
            value: 0.0.0.0:8080
          - name: CYRENE_WORKSPACE_RELAY_HEALTH_BIND
            value: 0.0.0.0:8081
          - name: CYRENE_WORKSPACE_RELAY_ACA_INGRESS_ASSERTION
            value: client-certificate-required
          - name: CYRENE_WORKSPACE_RELAY_HEALTH_BIND_ASSERTION
            value: probe-only-not-ingress
          - name: CYRENE_WORKSPACE_DIRECTORY_DATABASE_URL
            secretRef: workspace-directory-database-url
          - name: CYRENE_WORKSPACE_RELAY_BFF_CLIENT_CA_BUNDLE
            value: /etc/cyrene/bff-ca/roots.pem
          - name: CYRENE_WORKSPACE_RELAY_BFF_CERT_ALLOWLIST
            value: /etc/cyrene/bff-ca/allowlist.json
          - name: CYRENE_WORKSPACE_RELAY_WEB_HANDOFF_ISSUER
            value: REPLACE_WITH_EXACT_BFF_HANDOFF_ISSUER
          - name: CYRENE_WORKSPACE_RELAY_WEB_HANDOFF_AUDIENCE
            value: REPLACE_WITH_EXACT_RELAY_HANDOFF_AUDIENCE
          - name: CYRENE_WORKSPACE_RELAY_WEB_HANDOFF_PUBLIC_KEY_BASE64URL
            value: REPLACE_WITH_CANONICAL_BFF_ED25519_PUBLIC_KEY_BASE64URL
        probes:
          - type: Startup
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
            successThreshold: 1
          - type: Liveness
            httpGet:
              path: /healthz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
          - type: Readiness
            httpGet:
              path: /readyz
              port: 8081
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 1
            successThreshold: 1
        resources:
          cpu: 0.25
          memory: 0.5Gi
        volumeMounts:
          - volumeName: directory-postgres-ca
            mountPath: /etc/cyrene/postgres-ca
          - volumeName: workspace-relay-bff-trust
            mountPath: /etc/cyrene/bff-ca
          # This mount does not enable WorkspaceConnector authentication.
          - volumeName: workspace-relay-device-ca
            mountPath: /etc/cyrene/device-ca
    scale:
      minReplicas: 1
      maxReplicas: 1
    terminationGracePeriodSeconds: 30
    volumes:
      - name: directory-postgres-ca
        storageType: Secret
        secrets:
          - secretRef: workspace-directory-postgres-ca
            path: roots.pem
      - name: workspace-relay-bff-trust
        storageType: Secret
        secrets:
          - secretRef: workspace-relay-bff-client-ca
            path: roots.pem
          - secretRef: workspace-relay-bff-certificate-allowlist
            path: allowlist.json
      - name: workspace-relay-device-ca
        storageType: Secret
        secrets:
          - secretRef: workspace-relay-device-client-ca
            path: roots.pem
type: Microsoft.App/containerApps
