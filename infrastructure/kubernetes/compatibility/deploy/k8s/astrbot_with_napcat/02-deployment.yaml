apiVersion: apps/v1
kind: Deployment
metadata:
  name: astrbot-stack
  namespace: astrbot-ns
  labels:
    app: astrbot-stack
spec:
  replicas: 1
  strategy:
    type: Recreate # Use Recreate strategy for stateful applications
  selector:
    matchLabels:
      app: astrbot-stack
  template:
    metadata:
      labels:
        app: astrbot-stack
    spec:
      # 设置固定主机名，避免 Pod 重启后主机名变化触发风控
      hostname: napcat-host
      subdomain: astrbot-stack
      # 优雅关闭时间，给 NapCat 足够时间保存状态
      terminationGracePeriodSeconds: 60
      securityContext:
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      
      # 初始化容器：首次生成随机 machine-id，后续复用
      initContainers:
        - name: initialize-app-data-ownership
          image: &astrbot-image __ASTRBOT_IMAGE_REF__
          imagePullPolicy: IfNotPresent
          command: ["chown", "-R", "1654:0", "/AstrBot/data"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
          volumeMounts:
            - name: data
              mountPath: /AstrBot/data
        - name: initialize-napcat-data-ownership
          image: busybox:1.37.0
          command: ["chown", "-R", "1000:1000", "/napcat/config", "/napcat/qq"]
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
          volumeMounts:
            - name: napcat-config
              mountPath: /napcat/config
            - name: napcat-qq
              mountPath: /napcat/qq
        - name: init-machine-id
          image: busybox:1.37.0
          command:
            - /bin/sh
            - -c
            - |
              # 仅在 machine-id 不存在时随机生成一个
              if [ ! -f /machine-id-data/machine-id ]; then
                # 使用 /dev/urandom 生成随机 UUID (32位十六进制)
                cat /proc/sys/kernel/random/uuid | tr -d '-' > /machine-id-data/machine-id
                echo "Machine ID generated: $(cat /machine-id-data/machine-id)"
              else
                echo "Machine ID exists: $(cat /machine-id-data/machine-id)"
              fi
          volumeMounts:
            - name: machine-id-data
              mountPath: /machine-id-data
        - name: migrate-database
          image: *astrbot-image
          imagePullPolicy: IfNotPresent
          command: ["dotnet", "/app/migrator/AstrBot.DatabaseMigrator.dll"]
          securityContext:
            runAsUser: 1654
            runAsGroup: 0
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: ConnectionStrings__AstrBotMigrator
              valueFrom:
                secretKeyRef:
                  name: __ASTRBOT_POSTGRES_SECRET_NAME__
                  key: migrator-connection-string
            - name: ConnectionStrings__AstrBot
              valueFrom:
                secretKeyRef:
                  name: __ASTRBOT_POSTGRES_SECRET_NAME__
                  key: app-connection-string
      
      containers:
        - name: napcat
          image: __NAPCAT_IMAGE_REF__
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: NAPCAT_UID
              value: "1000"
            - name: NAPCAT_GID
              value: "1000"
            - name: MODE
              value: "astrbot"
            - name: TZ
              value: "Asia/Shanghai"
          # 资源限制：确保 Guaranteed QoS，减少被驱逐的可能
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          volumeMounts:
            - name: napcat-config
              mountPath: /app/napcat/config
            - name: napcat-qq
              mountPath: /app/.config/QQ
            # 挂载持久化的 machine-id
            - name: machine-id-data
              mountPath: /etc/machine-id
              subPath: machine-id
              readOnly: true
        
        - name: astrbot
          image: *astrbot-image
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - umask 0002; exec dotnet /app/dotnethost/AstrBot.DotNetHost.dll
          securityContext:
            runAsUser: 1654
            runAsGroup: 0
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          env:
            - name: TZ
              value: "Asia/Shanghai"
            - name: ASPNETCORE_URLS
              value: "http://+:15031"
            - name: Runtime__Mode
              value: Production
            - name: DeveloperCompatibility__PythonPluginsEnabled
              value: "false"
            - name: HostRuntimeOptions__EnableWorkerSupervision
              value: "false"
            - name: ConnectionStrings__AstrBot
              valueFrom:
                secretKeyRef:
                  name: __ASTRBOT_POSTGRES_SECRET_NAME__
                  key: app-connection-string
            - name: ProviderPersistence__CertificatePath
              value: /run/astrbot/provider-persistence/provider-persistence.pfx
            - name: ProviderPersistence__CertificatePassword
              valueFrom:
                secretKeyRef:
                  name: __ASTRBOT_PROVIDER_PERSISTENCE_SECRET_NAME__
                  key: provider-persistence-password
            - name: ProviderPersistence__RequireKeyEncryption
              value: "true"
            - name: ProviderEndpointAuth__DashboardJwtSecretFile
              value: /run/astrbot/provider-endpoint-auth/dashboard-jwt-secret
            - name: ProviderEndpointAuth__BootstrapSecretFile
              value: /run/astrbot/provider-endpoint-auth/bootstrap-secret
          ports:
            - containerPort: 15031
              name: dotnet-host
          livenessProbe:
            httpGet:
              path: /health/live
              port: 15031
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 15031
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /AstrBot/data
            - name: localtime
              mountPath: /etc/localtime
              readOnly: true
            - name: provider-persistence-certificate
              mountPath: /run/astrbot/provider-persistence/provider-persistence.pfx
              subPath: provider-persistence.pfx
              readOnly: true
            - name: provider-endpoint-auth
              mountPath: /run/astrbot/provider-endpoint-auth
              readOnly: true

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: astrbot-data-pvc
        - name: napcat-config
          persistentVolumeClaim:
            claimName: napcat-config-pvc
        - name: napcat-qq
          persistentVolumeClaim:
            claimName: napcat-qq-pvc
        # 持久化 machine-id（首次随机生成，后续复用）
        - name: machine-id-data
          persistentVolumeClaim:
            claimName: napcat-machine-id-pvc
        - name: localtime
          hostPath:
            path: /etc/localtime
            type: File
        - name: provider-persistence-certificate
          secret:
            secretName: __ASTRBOT_PROVIDER_PERSISTENCE_SECRET_NAME__
            defaultMode: 416 # 0640: readable by AstrBot UID 1654 / group 0 only.
            items:
              - key: provider-persistence.pfx
                path: provider-persistence.pfx
        - name: provider-endpoint-auth
          secret:
            secretName: __ASTRBOT_PROVIDER_ENDPOINT_AUTH_SECRET_NAME__
            defaultMode: 288 # 0440: readable by AstrBot UID 1654 / group 0 only.
            items:
              - key: dashboard-jwt-secret
                path: dashboard-jwt-secret
              - key: provider-bootstrap-secret
                path: bootstrap-secret
