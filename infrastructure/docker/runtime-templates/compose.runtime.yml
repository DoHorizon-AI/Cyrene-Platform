services:
  database:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${CYRENE_POSTGRES_USER:-cyrene}
      POSTGRES_PASSWORD: ${CYRENE_POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${CYRENE_POSTGRES_DATABASE:-cyrene}
    volumes:
      - database_data:/var/lib/postgresql/data
    networks: [database]
  app:
    image: ${CYRENE_IMAGE_REF:?must be pinned by digest}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_started
    networks: [database, edge]
networks:
  database:
    internal: true
  edge:
volumes:
  database_data:
