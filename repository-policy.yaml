schema_version: cyrene.repository-policy.v1
repository:
  logical_name: Cyrene-Platform
  lifecycle_class: PUBLIC_FOUNDATION
  visibility: public
  source_owner: Platform Core Team
  remote_default_branch: develop
  integration_branch: develop
  release_branch: release
  default_branch: develop
ownership:
  owns:
  - Product-neutral control, lifecycle, resource, ArtifactRef, and transport contracts
  - Rust Kernel, process isolation & cgroup sandboxing
  - Product-neutral Kernel execution and resource-fact contracts
  - Generic plugin installation, resolution, admission, health, and endpoint grants
  - Existing Workspace BFF and Connector hosts with only Directory-derived caller authorization, the closed Workspace Product operation map, fixed owner routes, bounded transport, and read-only pinned contract loading
  - Generic daemon units and repository CI tooling
  does_not_own:
  - Capability payload contracts, generated capability SDKs, or capability TCKs
  - Concrete plugin implementations, Product service adapters, or open-ended business routing outside the bounded Workspace host surface
  - Product-private domain state, schemas, lifecycle, workflows, retries, persistence, or service decisions
  - Training epoch loops or Serving engine internals
  - Product deployment and edge templates, including Workspace Azure application templates owned by the consuming repository
  - Product compatibility snapshots and authoritative cross-repository Product or plugin catalogs; the BFF only loads the pinned read-only operation contract bundle
build:
  independent: true
  build_systems:
  - cargo
  - pyproject
artifacts:
  package_units:
  - cyrene-preflight
  - cyrene-artifacts
  native_binaries:
  - cy-kernel-daemon
  - cy-node-agent
distribution:
  role: COMPONENT_RELEASE
  profiles:
  - core
  standalone_user_product: false
integration:
  multi_repo_required: false
authorities:
  ci: github
  release: github_releases
  deployment: consuming_repository
trust:
  public_requires_private: false
versioning:
  scheme: semver
  scope: repository
  tag_strategy: repository
  tag_pattern: v{version}
  automated_release: true
