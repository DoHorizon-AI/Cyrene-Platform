[package]
name = "cy-adapter-client"
version = "0.1.0"
edition = "2021"
description = "Generic local IPC client for CYRENE hardware adapter processes"
license = "Apache-2.0"

[lib]
name = "cy_adapter_client"
path = "src/lib.rs"

[dependencies]
cy-kernel-api = { path = "../cy-kernel-api" }
cy-proto = { path = "../../../contracts/rust/cy-proto" }
prost = "0.14"
prost-types = "0.14"
nix = { version = "0.31", features = ["socket", "user", "process"] }
