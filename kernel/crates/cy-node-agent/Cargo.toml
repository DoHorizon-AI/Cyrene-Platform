[package]
name = "cy-node-agent"
version = "0.1.0"
edition = "2021"
description = "Node-agent crate scaffold; hardware probing is planned."
license = "Apache-2.0"

[lib]
name = "cy_node_agent"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
cy-proto = { path = "../../../contracts/rust/cy-proto" }
cy-manifest = { path = "../../../contracts/rust/cy-manifest" }
sysinfo = "0.30"
tokio = { version = "1.35", features = ["full"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3.8"
