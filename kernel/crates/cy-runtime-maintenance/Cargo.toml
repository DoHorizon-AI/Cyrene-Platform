[package]
name = "cy-runtime-maintenance"
version = "0.1.0"
edition = "2021"
description = "Durable runtime update readiness and admission gate for CYRENE"
license = "AGPL-3.0-only"

[lib]
name = "cy_runtime_maintenance"
path = "src/lib.rs"

[[bin]]
name = "cyrene-runtime-maintenance"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "1.0"
uuid = { version = "1", features = ["v4"] }
nix = { version = "0.29", features = ["socket", "user", "fs"] }
cy-proto = { path = "../../../contracts/rust/cy-proto" }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "io-util"] }
tonic = "0.12"
tower = { version = "0.4", features = ["util"] }

[dev-dependencies]
tempfile = "3"
