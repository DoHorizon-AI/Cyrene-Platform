[package]
name = "cy-kernel-daemon"
version = "0.1.0"
edition = "2021"
description = "Rust composition root for the CYRENE node kernel"
license = "Apache-2.0"

[lib]
name = "cy_kernel_daemon"
path = "src/lib.rs"

[features]
# Exposes test-only constructors (e.g. InstanceActor::new_for_test) for use in
# integration/unit tests in downstream crates.
test-utils = []

[dependencies]
cy-adapter-client = { path = "../cy-adapter-client" }
cy-kernel-api = { path = "../cy-kernel-api" }
cy-resource-manager = { path = "../cy-resource-manager" }
cy-proto = { path = "../../../contracts/rust/cy-proto" }
uuid = { version = "1", features = ["v4"] }
prost-types = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "io-util"] }
tokio-stream = { version = "0.1", features = ["net", "sync"] }
tonic = "0.11"

# SO_PEERCRED is a Unix-only facility, so nix is only compiled on Unix hosts.
# Gating it behind a target clause keeps `cargo check -p cy-kernel-daemon`
# working on non-Unix platforms where the Accept wrapper is cfg(unix)-gated.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["socket"] }
