[package]
name = "cy-sandbox-client"
version = "0.1.0"
edition = "2021"
description = "Pure-safe Kernel client for the external CYRENE Sandbox Adapter Host"
license = "AGPL-3.0-only"

[lib]
name = "cy_sandbox_client"
path = "src/lib.rs"

[dependencies]
cy-adapter-client = { path = "../cy-adapter-client" }
cy-kernel-api = { path = "../cy-kernel-api" }
cy-proto = { path = "../../../contracts/rust/cy-proto" }
nix = { version = "0.29", features = ["socket"] }
prost = "0.12"
